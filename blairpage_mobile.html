        const hasBlogMarker = !!doc.querySelector(".blog-grid, .blog-page, .blog-shell, article.blog-post, .blog-container");

        const headingText = (doc.querySelector("h1, h2")?.textContent || "").toLowerCase();

        if (!hasResumeShell) return false;

      function fuseMobileSections(pulledShell) {
        if (!pulledShell) return;

        const directSections = Array.from(pulledShell.querySelectorAll(":scope > section"));
        if (!directSections.length) return;

        const topSection = directSections.find(function (section) {
          return section.querySelector(".identity-row, .profile-img, .identity-info");
        });

        if (topSection) {
          topSection.classList.add("bp-fused-top-card");
        }

        let aboutSection = directSections.find(function (section) {
          const heading = section.querySelector(":scope > h2");
          return heading && heading.textContent.trim().toLowerCase() === "about";
        });

        /*
          Keep the mobile page synced to the real index.html About section.
          Some browser parsers can nest/repair the source HTML differently, so do not rely
          only on :scope > section. Find the closest standalone section that owns h2 About.
        */
        if (!aboutSection) {
          const aboutHeadingFallback = Array.from(pulledShell.querySelectorAll("h2")).find(function (heading) {
            return heading.textContent.trim().toLowerCase() === "about";
          });

          if (aboutHeadingFallback) {
            const closestSection = aboutHeadingFallback.closest("section");
            if (closestSection && closestSection !== pulledShell && closestSection !== topSection) {
              aboutSection = closestSection;
            }
          }
        }

        if (topSection && aboutSection && aboutSection !== topSection && !topSection.querySelector(":scope > .bp-fused-about")) {
          const aboutWrap = document.createElement("div");
          aboutWrap.className = "bp-fused-about";

          const aboutHeading = aboutSection.querySelector("h2");
          if (aboutHeading && !aboutSection.querySelector(".rarity-inline-hover-link")) {
            const rarityHeading = document.createElement("div");
            rarityHeading.className = "bp-rarity-inline-heading";
            rarityHeading.style.margin = "0.18rem auto 0.7rem";
            rarityHeading.style.textAlign = "center";
            rarityHeading.style.fontSize = "0.74rem";
            rarityHeading.style.fontWeight = "600";
            rarityHeading.style.letterSpacing = "0.2px";
            rarityHeading.innerHTML = '<a href="https://blairyfairy.github.io/BlairPage/blair_name_rarity_vs_jennifers_vs_wealth.html" target="_blank" rel="noopener noreferrer" class="rarity-inline-hover-link">Burness Drake/McCoy · 10/24/1987 Maiden Name &amp; Lineage Rarity Odds 1 in 97,979.1 sextillion</a>';
            aboutHeading.insertAdjacentElement("afterend", rarityHeading);
          }

          Array.from(aboutSection.childNodes).forEach(function (node) {
            aboutWrap.appendChild(node);
          });

          const aboutAnchor = topSection.querySelector(":scope > .bp-fused-matrix, :scope > .bp-fused-experience");
          if (aboutAnchor) {
            topSection.insertBefore(aboutWrap, aboutAnchor);
          } else {
            topSection.appendChild(aboutWrap);
          }
          aboutSection.remove();
        }

        const matrixSection = Array.from(pulledShell.querySelectorAll(":scope > section")).find(function (section) {
          return section.querySelector(".profile-matrix, .matrix-grid, .matrix-card");
        });

        if (topSection && matrixSection && matrixSection !== topSection) {
          const matrixWrap = document.createElement("div");
          matrixWrap.className = "bp-fused-matrix";

          Array.from(matrixSection.childNodes).forEach(function (node) {
            matrixWrap.appendChild(node);
          });

          topSection.appendChild(matrixWrap);
          matrixSection.remove();
        }

        if (topSection) {
          const shellChildren = Array.from(pulledShell.childNodes);
          const experienceHeading = shellChildren.find(function (node) {
            return node.nodeType === 1 &&
              node.matches("h2") &&
              node.textContent.trim().toLowerCase() === "professional experience";
          });

          if (experienceHeading) {
            let experienceWrap = topSection.querySelector(".bp-fused-experience");
            if (!experienceWrap) {
              experienceWrap = document.createElement("div");
              experienceWrap.className = "bp-fused-experience";
              experienceWrap.appendChild(experienceHeading);
              topSection.appendChild(experienceWrap);
            }

            let next = experienceHeading.nextSibling;
            while (next) {
              const current = next;
              next = next.nextSibling;

              if (
                current.nodeType === 1 &&
                current.matches("section.resume-sections, section.education-wrapper, section.certifications-section, section.volunteer-section")
              ) {
                break;
              }

              if (
                current.nodeType === 1 &&
                (current.matches(".timeline-item") || current.matches("div.timeline-item") || current.matches("style") || current.matches("script"))
              ) {
                experienceWrap.appendChild(current);
              } else if (current.nodeType === 3 && !current.textContent.trim()) {
                experienceWrap.appendChild(current);
              }
            }

            Array.from(pulledShell.children).forEach(function(node){
              if (node === topSection || node === experienceWrap) return;
              if (node.matches && node.matches(".timeline-item, div.timeline-item")) {
                experienceWrap.appendChild(node);
              }
            });
          }
        }

        const volunteerSection = Array.from(pulledShell.querySelectorAll(":scope > section")).find(function (section) {
          const heading = section.querySelector("h2");
          return heading && heading.textContent.trim().toLowerCase() === "volunteer work";
        });

        const certSection = Array.from(pulledShell.querySelectorAll(":scope > section")).find(function (section) {
          const heading = section.querySelector("h2");
          return heading && heading.textContent.trim().toLowerCase() === "certifications";
        });

        if (volunteerSection && certSection && volunteerSection !== certSection) {
          const volunteerWrap = document.createElement("div");
          volunteerWrap.className = "bp-fused-volunteer";
          Array.from(volunteerSection.childNodes).forEach(function (node) {
            volunteerWrap.appendChild(node);
          });
          certSection.appendChild(volunteerWrap);
          volunteerSection.remove();
        }
      }

        pulledShell.querySelectorAll(":scope > script").forEach(function (el) { el.remove(); });

        injectHardcodedPortfolioRow(pulledShell);

        if (connectBtn && !connectBtn.dataset.bpWired) {
          connectBtn.dataset.bpWired = "true";
          const textSpan = connectBtn.querySelector(".btn-text");
          connectBtn.addEventListener("click", function () {
            connectBtn.classList.toggle("following");
            const isFollowing = connectBtn.classList.contains("following");
            if (textSpan) {
              textSpan.textContent = isFollowing ? "Connected ✓" : "Connect";
            }
            window.location.href = "mailto:blairpagedrakemccoy@gmail.com?subject=Connect%20from%20Portfolio";
          });

        pulledShell.querySelectorAll(".card-toggle").forEach(function (button) {
          if (button.dataset.bpWired === "true") return;
          button.dataset.bpWired = "true";

          button.addEventListener("click", function () {
            const card = button.closest(".matrix-card");
            if (!card) return;

   FORCE ALL JOB GAPS TO MATCH PERCONA -> CRAFTARTEDU
   script append
   ========================================== */

function forceEqualExperienceGaps() {
  const experience = document.querySelector(
    ".bp-fused-top-card .bp-fused-experience"
  );
  if (!experience) return;

  const jobs = Array.from(
    experience.querySelectorAll(":scope > .timeline-item")
  ).filter((job) => {
    const text = (job.textContent || "").trim();
    return text.length > 0 && job.offsetParent !== null;
  });

  if (jobs.length < 2) return;

  // reset spacing first so measurements are clean
  jobs.forEach((job) => {
    job.style.setProperty("margin-top", "0px", "important");
    job.style.setProperty("margin-bottom", "0px", "important");
    job.style.setProperty("padding-top", "0px", "important");
    job.style.setProperty("padding-bottom", "0px", "important");
    job.style.setProperty("display", "flow-root", "important");
  });

  function getJobLabel(job) {
    return (job.textContent || "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  let targetGap = null;

  for (let i = 0; i < jobs.length - 1; i++) {
    const current = getJobLabel(jobs[i]);
    const next = getJobLabel(jobs[i + 1]);

    if (current.includes("percona") && next.includes("craftartedu")) {
      const a = jobs[i].getBoundingClientRect();
      const b = jobs[i + 1].getBoundingClientRect();
      targetGap = Math.round(b.top - a.bottom);
      break;
    }
  }

  // fallback if Percona -> CraftArtEdu is not found
  if (targetGap === null) {
    const a = jobs[0].getBoundingClientRect();
    const b = jobs[1].getBoundingClientRect();
    targetGap = Math.round(b.top - a.bottom);
  }

  // apply that exact same gap to every job after the first
  for (let i = 1; i < jobs.length; i++) {
    const prevBox = jobs[i - 1].getBoundingClientRect();
    const thisBox = jobs[i].getBoundingClientRect();
    const currentGap = thisBox.top - prevBox.bottom;
    const needed = targetGap - currentGap;

    jobs[i].style.setProperty("margin-top", `${needed}px`, "important");
  }

  // keep a small finish below the last job before the next section
  const lastJob = jobs[jobs.length - 1];
  if (lastJob) {
    lastJob.style.setProperty("margin-bottom", "10px", "important");
  }
}

function queueForceEqualExperienceGaps() {
  requestAnimationFrame(forceEqualExperienceGaps);
  setTimeout(forceEqualExperienceGaps, 0);
  setTimeout(forceEqualExperienceGaps, 120);
  setTimeout(forceEqualExperienceGaps, 320);
  setTimeout(forceEqualExperienceGaps, 700);
}

/* rerun after layout/build/toggles */
document.addEventListener("click", function (e) {
  if (e.target.closest(".job-click")) {
    queueForceEqualExperienceGaps();
  }
});

window.addEventListener("load", queueForceEqualExperienceGaps);
window.addEventListener("resize", queueForceEqualExperienceGaps);
document.addEventListener("DOMContentLoaded", queueForceEqualExperienceGaps);

    }
  }

  function queueStaticSpacing() {

      rafId = null;
    });

    clearTimeout(lockTimer);

  const observer = new MutationObserver(function () {
    queueStaticSpacing();

<script>
(function () {
  const ROOT_SELECTOR = ".bp-mobile-page #mobileContent .bp-fused-top-card .bp-fused-experience";
  const JOB_SELECTOR = ".timeline-item";
  const FIXED_GAP = 36; // match your current spacing

  function getExperienceRoot() {
    return document.querySelector(ROOT_SELECTOR);
  }

  function applyStableSpacing() {
    const root = getExperienceRoot();
    if (!root) return;

    const jobs = Array.from(root.querySelectorAll(JOB_SELECTOR));
    if (!jobs.length) return;

    jobs.forEach((job, index) => {
      job.style.setProperty("margin-top", index === 0 ? "0px" : FIXED_GAP + "px", "important");
      job.style.setProperty("margin-bottom", "0px", "important");
      job.style.setProperty("padding-top", "0px", "important");
      job.style.setProperty("padding-bottom", "0px", "important");
      job.style.setProperty("overflow", "visible", "important");
      job.style.setProperty("contain", "none", "important");
    });

    const lastJob = jobs[jobs.length - 1];
    if (lastJob) {
      lastJob.style.setProperty("margin-bottom", "10px", "important");
    }
  }

  function stabilizeHeaderLayout(toggle) {
    const parent = toggle.parentElement;
    if (!parent) return null;

    const collapsible = parent.querySelector(":scope > .job-list-collapsible");
    if (!collapsible) return null;

    const headerNodes = [];
    Array.from(parent.childNodes).forEach((node) => {
      if (node === collapsible) return;
      headerNodes.push(node);
    });

    headerNodes.forEach((node) => {
      if (node.nodeType === 1) {
        node.style.setProperty("position", "relative", "important");
        node.style.setProperty("z-index", "2", "important");
      }
    });

    collapsible.style.setProperty("position", "relative", "important");
    collapsible.style.setProperty("z-index", "1", "important");
    collapsible.style.setProperty("overflow", "hidden", "important");
    collapsible.style.setProperty("contain", "layout paint", "important");
    collapsible.style.setProperty("backface-visibility", "hidden", "important");
    collapsible.style.setProperty("transform", "translateZ(0)", "important");

    return collapsible;
  }

  function releaseCollapsibleContainment(collapsible) {
    if (!collapsible) return;
    collapsible.style.removeProperty("overflow");
    collapsible.style.removeProperty("contain");
    collapsible.style.removeProperty("backface-visibility");
    collapsible.style.removeProperty("transform");
  }

  function toggleJobClick(toggle) {
    const parent = toggle.parentElement;
    if (!parent) return;

    const collapsible = parent.querySelector(":scope > .job-list-collapsible");
    const plus = toggle.querySelector(".job-plus");
    if (!collapsible) return;

    const prepared = stabilizeHeaderLayout(toggle);

    const isOpen = collapsible.classList.contains("expanded");
    const nextOpen = !isOpen;

    collapsible.classList.toggle("expanded", nextOpen);
    collapsible.style.setProperty("display", nextOpen ? "block" : "none", "important");
    toggle.setAttribute("aria-expanded", nextOpen ? "true" : "false");

    if (plus) {
      plus.textContent = nextOpen ? "−" : "+";
    }

    requestAnimationFrame(() => {
      applyStableSpacing();
      setTimeout(applyStableSpacing, 40);
      setTimeout(applyStableSpacing, 120);
      setTimeout(() => {
        releaseCollapsibleContainment(prepared);
        applyStableSpacing();
      }, 220);
    });
  }

  function handleToggleEvent(e) {
    const toggle = e.target.closest(".job-click");
    if (!toggle) return;

    const root = getExperienceRoot();
    if (!root || !root.contains(toggle)) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    toggleJobClick(toggle);
  }

  document.addEventListener("click", handleToggleEvent, true);

  document.addEventListener("keydown", function (e) {
    const toggle = e.target.closest(".job-click");
    if (!toggle) return;

    const root = getExperienceRoot();
    if (!root || !root.contains(toggle)) return;

    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      e.stopPropagation();
      e.stopImmediatePropagation();
      toggleJobClick(toggle);
    }
  }, true);

  document.addEventListener("DOMContentLoaded", function () {
    applyStableSpacing();
    setTimeout(applyStableSpacing, 120);
    setTimeout(applyStableSpacing, 400);
  });

  window.addEventListener("load", function () {
    applyStableSpacing();
    setTimeout(applyStableSpacing, 120);
    setTimeout(applyStableSpacing, 400);
  });
})();
</script>

(function () {
  const CREDLY_SRC_MATCH = /(?:cdn\.)?credly\.com\/assets\/utilities\/embed\.js/i;

  function isCredlyScript(node) {
    return !!(
      node &&
      node.tagName === "SCRIPT" &&
      typeof node.src === "string" &&
      CREDLY_SRC_MATCH.test(node.src)
    );
  }

  function keepOnlyOneCredlyScript() {
    const scripts = Array.from(document.querySelectorAll("script[src]")).filter(isCredlyScript);
    if (!scripts.length) return null;

    const keeper = scripts[0];
    keeper.setAttribute("data-bp-credly-stable", "true");

    scripts.slice(1).forEach((s) => {
      s.remove();
    });

    return keeper;
  }

  function forceCredlyVisible(root) {
    if (!root) return;

    root.querySelectorAll(".credly-embed-badge, [data-share-badge-id]").forEach((node) => {
      node.style.setProperty("display", "block", "important");

      frame.style.setProperty("border", "0", "important");
      frame.style.setProperty("margin", "0 auto 12px auto", "important");
    });
  }

  const originalRemove = Element.prototype.remove;
  Element.prototype.remove = function () {
    if (isCredlyScript(this) && this.getAttribute("data-bp-credly-stable") === "true") {
      return;
    }
    return originalRemove.call(this);
  };

  const originalAppendChild = Node.prototype.appendChild;
  Node.prototype.appendChild = function (child) {
    if (isCredlyScript(child)) {
      const existingStable = Array.from(document.querySelectorAll("script[src]")).find(
        (s) => isCredlyScript(s) && s.getAttribute("data-bp-credly-stable") === "true"
      );

      if (existingStable) {
        return child;
      }
    }
    return originalAppendChild.call(this, child);
  };

    keepOnlyOneCredlyScript();
    forceCredlyVisible(root);
  }

  document.addEventListener("DOMContentLoaded", function () {
    stabilizeCredly();

    setTimeout(stabilizeCredly, 500);

  });

  window.addEventListener("load", function () {
    stabilizeCredly();
    setTimeout(stabilizeCredly, 150);
    setTimeout(stabilizeCredly, 500);
    setTimeout(stabilizeCredly, 1300);
  });

  const observer = new MutationObserver(function () {
    stabilizeCredly();
  });

  document.addEventListener("DOMContentLoaded", function () {
    observer.observe(document.body, {
      childList: true,
      subtree: true
    });
  });
})();

<script>
/* ==========================================
   FORCE ONE-PASS RENDER STABILIZER
   prevents blinking / staged repaint
   ========================================== */
(function () {
  const body = document.body;
  const shell = document.querySelector('.mobile-shell');
  if (!body || !shell) return;

  body.classList.add('render-lock');
  body.classList.remove('render-ready');

  function getPendingAssets(root) {
    const pending = [];

    root.querySelectorAll('img').forEach(function (img) {
      if (!img.complete) pending.push(img);
    });

    root.querySelectorAll('iframe').forEach(function (frame) {
      const src = frame.getAttribute('src') || '';
      if (src && (src.includes('credly') || src.includes('youtube') || src.includes('pdf'))) {
        pending.push(frame);
      }
    });

    root.querySelectorAll('.credly-embed-badge, [data-share-badge-id], [data-iframe-width]').forEach(function (node) {
      pending.push(node);
    });

    return pending;
  }

  function lockVisibleState(root) {
    root.querySelectorAll('img, svg, iframe, .credly-embed-badge, [data-share-badge-id], [data-iframe-width], .icon-wrap, .job-logo, .logo-img').forEach(function (el) {
      el.style.setProperty('opacity', '1', 'important');
      el.style.setProperty('visibility', 'visible', 'important');
      el.style.setProperty('transition', 'none', 'important');
      el.style.setProperty('animation', 'none', 'important');
      el.style.setProperty('transform', 'translateZ(0)', 'important');
      el.style.setProperty('backface-visibility', 'hidden', 'important');
      el.style.setProperty('-webkit-backface-visibility', 'hidden', 'important');
    });
  }

  function unlockRender() {
    lockVisibleState(shell);
    body.classList.remove('render-lock');
    body.classList.add('render-ready');
    shell.classList.remove('is-loading');
    shell.classList.add('is-ready');
  }

  function waitForStableRender(root) {
    const assets = getPendingAssets(root);
    let remaining = assets.length;
    let released = false;

    function releaseOnce() {
      if (released) return;
      released = true;
      unlockRender();
    }

    if (!remaining) {
      requestAnimationFrame(function () {
        requestAnimationFrame(releaseOnce);
      });
      return;
    }

    const timeout = setTimeout(releaseOnce, 2200);

    function markDone() {
      remaining -= 1;
      if (remaining <= 0) {
        clearTimeout(timeout);
        requestAnimationFrame(function () {
          requestAnimationFrame(releaseOnce);
        });
      }
    }

    assets.forEach(function (asset) {
      if (asset.tagName === 'IMG') {
        if (asset.complete) {
          markDone();
        } else {
          asset.addEventListener('load', markDone, { once: true });
          asset.addEventListener('error', markDone, { once: true });
        }
        return;
      }

      if (asset.tagName === 'IFRAME') {
        asset.addEventListener('load', markDone, { once: true });
        setTimeout(markDone, 900);
        return;
      }

      /* credly wrappers / injected nodes */
      setTimeout(markDone, 900);
    });
  }

  function stabilizeAfterInject() {
    lockVisibleState(shell);

    const observer = new MutationObserver(function () {
      lockVisibleState(shell);
    });

    observer.observe(shell, {
      subtree: true,
      childList: true,
      attributes: true
    });

    waitForStableRender(shell);

    setTimeout(function () {
      observer.disconnect();
      lockVisibleState(shell);
      unlockRender();
    }, 2600);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', stabilizeAfterInject);
  } else {
    stabilizeAfterInject();
  }

  window.addEventListener('load', function () {
    lockVisibleState(shell);
    unlockRender();
  });
})();
</script>

    node.setAttribute("data-iframe-height", "210");

    frame.style.setProperty("display", "block", "important");

    }

  let credlyScript = document.querySelector('script[data-credly-embed-lock="true"]');

          frame.style.setProperty("display", "block", "important");

        });
      }, 250);

      setTimeout(function () {
        runCredlyParse();
      }, 900);
    };

    document.body.appendChild(credlyScript);
  } else {
    runCredlyParse();
    setTimeout(runCredlyParse, 250);
    setTimeout(runCredlyParse, 900);
  }

  if (!root.__credlyObserverAttached) {

      });
    });

    observer.observe(root, {
      subtree: true,
      childList: true
    });

    root.__credlyObserverAttached = true;
  }

  /* ------------------------------------------

  root.querySelectorAll(".credly-embed-badge, [data-share-badge-id], [data-iframe-width]").forEach(function (node) {

(function () {
  const VIDEO_ID = 'UpvRg_2oD7A';
  const MOBILE_BP = 900;

  const PLAYER_ID = 'forced-music-player';
  const BUTTON_ID = 'forced-music-button';
  const FRAME_ID = 'musicFrame';
  const STYLE_ID = 'forced-music-player-style';

  function buildSrc(muted) {
    return (
      'https://www.youtube.com/embed/' + VIDEO_ID +
      '?autoplay=1' +
      '&mute=' + (muted ? '1' : '0') +
      '&controls=1' +
      '&loop=1' +
      '&playlist=' + VIDEO_ID +
      '&playsinline=1'
    );
  }

  function removeOld() {
    document.getElementById(PLAYER_ID)?.remove();
    document.getElementById(BUTTON_ID)?.remove();
    document.getElementById(STYLE_ID)?.remove();
  }

  function injectStyle() {
    const style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent = `
      #${PLAYER_ID} {
        position: fixed !important;
        left: 20px !important;

        z-index: 10000 !important;

        left: 20px !important;

        z-index: 10001 !important;
        border-radius: 50% !important;
        border: 1px solid rgba(240,239,244,0.35) !important;

      }

      @media (max-width: 900px) {
        #${PLAYER_ID} {
          width: min(260px, calc(100vw - 24px)) !important;
          max-width: calc(100vw - 24px) !important;
        }
      }
    `;
    document.head.appendChild(style);
  }

  function create() {
    removeOld();
    injectStyle();

    const player = document.createElement('div');
    player.id = PLAYER_ID;

    const button = document.createElement('button');
    button.id = BUTTON_ID;
    button.type = 'button';

    let phase = 'closed';

    function updateButtonVisual() {
      if (phase === 'closed') {
        button.textContent = '▶';
        button.setAttribute('aria-label', 'Open and play video');
        button.setAttribute('title', 'Open and play video');
      } else if (phase === 'muted') {
        button.textContent = '🔊';
        button.setAttribute('aria-label', 'Unmute video');
        button.setAttribute('title', 'Unmute video');
      } else if (phase === 'unmuted') {
        button.textContent = '🔇';
        button.setAttribute('aria-label', 'Mute video');
        button.setAttribute('title', 'Mute video');
      } else {
        button.textContent = '✕';
        button.setAttribute('aria-label', 'Close video');
        button.setAttribute('title', 'Close video');
      }
    }

    function renderIframe(muted) {
      player.innerHTML = `
        <iframe
          id="${FRAME_ID}"
          width="100%"
          height="100%"
          src="${buildSrc(muted)}"
          title="YouTube video player"
          frameborder="0"
          allow="autoplay; encrypted-media; picture-in-picture"
          allowfullscreen loading="lazy">
        </iframe>
      `;
    }

    function openMuted() {
      phase = 'muted';
      player.style.setProperty('display', 'block', 'important');
      renderIframe(true);
      updateButtonVisual();
    }

    function unmute() {
      phase = 'unmuted';
      renderIframe(false);
      updateButtonVisual();
    }

    function muteReadyClose() {
      phase = 'muted-ready-close';
      renderIframe(true);
      updateButtonVisual();
    }

    function closeCompletely() {
      phase = 'closed';
      player.innerHTML = '';
      player.style.setProperty('display', 'none', 'important');
      updateButtonVisual();
    }

    button.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();

      if (phase === 'closed') return openMuted();
      if (phase === 'muted') return unmute();
      if (phase === 'unmuted') return muteReadyClose();
      if (phase === 'muted-ready-close') return closeCompletely();
    });

    document.body.appendChild(player);
    document.body.appendChild(button);

    closeCompletely();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', create);
  } else {
    create();
  }
})();
</script>

<script id="bp-final-lock-matrix-plus-minus-script">
(function () {
  /* Lightweight matrix-grid controller only.
     This replaces the repeated timeout / interval / MutationObserver locking loop
     with one delegated capture listener, so the six + / - buttons respond fast
     while keeping the exact same open/closed classes and visual CSS. */

  function getMatrixButton(target) {
    if (!target || !target.closest) return null;
    var btn = target.closest("#mobileContent .matrix-card .card-toggle");
    return btn || null;
  }

  function syncOne(card) {
    if (!card) return;
    var btn = card.querySelector(".card-toggle");
    var icon = card.querySelector(".expand-icon") || (btn && btn.querySelector(":scope > span:last-child"));
    var content = card.querySelector(".card-content");
    var isOpen = card.classList.contains("open") || card.classList.contains("bp-force-open");

    if (btn) btn.setAttribute("aria-expanded", String(isOpen));
    if (icon) {
      icon.classList.add("expand-icon");
      icon.textContent = isOpen ? "−" : "+";
      icon.style.setProperty("transform", "none", "important");
      icon.style.setProperty("rotate", "0deg", "important");
      icon.style.setProperty("scale", "1", "important");
      icon.style.setProperty("translate", "0 0", "important");
      icon.style.setProperty("animation", "none", "important");
      icon.style.setProperty("transition", "none", "important");
      icon.style.setProperty("transform-origin", "50% 50%", "important");
    }
    if (content) {
      content.style.setProperty("display", isOpen ? "block" : "none", "important");
    }
  }

  function syncAll() {
    document.querySelectorAll("#mobileContent .matrix-card").forEach(syncOne);
  }

  document.addEventListener("click", function (e) {
    var btn = getMatrixButton(e.target);
    if (!btn) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    var card = btn.closest(".matrix-card");
    if (!card) return;

    var nextOpen = !(card.classList.contains("open") || card.classList.contains("bp-force-open"));
    card.classList.toggle("open", nextOpen);
    card.classList.toggle("bp-force-open", nextOpen);
    syncOne(card);
  }, true);

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var btn = getMatrixButton(e.target);
    if (!btn) return;

    e.preventDefault();
    e.stopPropagation();
    e.stopImmediatePropagation();

    var card = btn.closest(".matrix-card");
    if (!card) return;

    var nextOpen = !(card.classList.contains("open") || card.classList.contains("bp-force-open"));
    card.classList.toggle("open", nextOpen);
    card.classList.toggle("bp-force-open", nextOpen);
    syncOne(card);
  }, true);

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", syncAll, { once: true });
  } else {
    syncAll();
  }
  window.addEventListener("load", syncAll, { once: true });
})();
</script>

<script id="bp-final-no-blank-stabilizer-script">
(function () {
  "use strict";

  var raf = window.requestAnimationFrame || function (fn) { return setTimeout(fn, 16); };

  function setImportant(el, prop, value) {
    if (el && el.style) el.style.setProperty(prop, value, "important");
  }

  function hasRealContent(content) {
    if (!content) return false;
    return !!content.querySelector(".resume-shell, .identity-row, .bp-fused-top-card, section, .matrix-card");
  }

  function forceVisibleState() {
    var body = document.body;
    var shell = document.getElementById("mobileShell") || document.querySelector(".mobile-shell");
    var content = document.getElementById("mobileContent");
    var loading = document.getElementById("loadingCard");

    if (body) {
      body.classList.remove("render-lock");
      body.classList.add("render-ready");
      setImportant(body, "visibility", "visible");
      setImportant(body, "opacity", "1");
      setImportant(body, "overflow-y", "auto");
      setImportant(body, "position", "static");
      setImportant(body, "height", "auto");
      setImportant(body, "min-height", "100vh");
      setImportant(body, "transform", "none");
      setImportant(body, "contain", "none");
    }

    if (shell) {
      shell.classList.remove("is-loading");
      shell.classList.add("is-ready");
      setImportant(shell, "display", "block");
      setImportant(shell, "visibility", "visible");
      setImportant(shell, "opacity", "1");
      setImportant(shell, "overflow", "visible");
      setImportant(shell, "height", "auto");
      setImportant(shell, "max-height", "none");
      setImportant(shell, "contain", "none");
      setImportant(shell, "content-visibility", "visible");
    }

    if (content) {
      setImportant(content, "display", "block");
      setImportant(content, "visibility", "visible");
      setImportant(content, "opacity", "1");
      setImportant(content, "overflow", "visible");
      setImportant(content, "height", "auto");
      setImportant(content, "max-height", "none");
      setImportant(content, "contain", "none");
      setImportant(content, "content-visibility", "visible");

      content.querySelectorAll("section, .section, .resume-shell, .bp-fused-top-card, .bp-fused-about, .bp-fused-matrix, .bp-fused-experience, .bp-fused-volunteer, .matrix-grid, .matrix-card, .timeline-item, .job-layout, .job-details, .education-wrapper, .course-grid, .certification-list, .volunteer-grid, img, iframe, .credly-embed-badge, [data-share-badge-id]").forEach(function (el) {
        setImportant(el, "visibility", "visible");
        setImportant(el, "opacity", "1");
        setImportant(el, "content-visibility", "visible");
        setImportant(el, "contain", "none");
      });

      content.querySelectorAll("img").forEach(function (img) {
        img.removeAttribute("loading");
        img.setAttribute("decoding", "async");
        setImportant(img, "visibility", "visible");
        setImportant(img, "opacity", "1");
      });
    }

    if (loading) {
      if (hasRealContent(content)) {
        loading.classList.remove("bp-final-fallback");
        loading.classList.add("bp-final-hidden");
      } else {
        loading.classList.remove("bp-final-hidden");
      }
    }
  }

  function recoverIfStillEmpty() {
    var content = document.getElementById("mobileContent");
    var loading = document.getElementById("loadingCard");

    forceVisibleState();

    if (!hasRealContent(content) && loading) {
      loading.classList.add("bp-final-fallback");
      loading.classList.remove("bp-final-hidden");
      if (!loading.dataset.bpFinalFallbackText) {
        loading.dataset.bpFinalFallbackText = "1";
        loading.textContent = "Loading BlairPage mobile content…";
      }
    }
  }

  function runBurst() {
    forceVisibleState();
    raf(forceVisibleState);
    setTimeout(forceVisibleState, 60);
    setTimeout(forceVisibleState, 180);
  }

  document.addEventListener("DOMContentLoaded", runBurst, { passive: true });
  window.addEventListener("load", runBurst, { passive: true });
  window.addEventListener("pageshow", runBurst, { passive: true });
  window.addEventListener("scroll", function () { raf(forceVisibleState); }, { passive: true });
  window.addEventListener("resize", function () { raf(forceVisibleState); }, { passive: true });
  document.addEventListener("visibilitychange", runBurst, { passive: true });

  [0, 80, 220, 500, 900, 1400, 2200, 3600].forEach(function (delay) {
    setTimeout(runBurst, delay);
  });

  setTimeout(recoverIfStillEmpty, 1800);
  setTimeout(recoverIfStillEmpty, 3600);

  var observerStarted = false;
  function startObserver() {
    if (observerStarted || !document.body) return;
    observerStarted = true;
    var observer = new MutationObserver(function () {
      raf(forceVisibleState);
    });
    observer.observe(document.body, {
      subtree: true,
      childList: true,
      attributes: true,
      attributeFilter: ["class", "style", "hidden", "loading"]
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startObserver, { once: true });
  } else {
    startObserver();
  }
})();
</script>

<script id="bp-final-mobile-order-cleanup">
(function () {
  "use strict";

  function txt(el) {
    return (el && el.textContent ? el.textContent : "").replace(/\s+/g, " ").trim();
  }

  function findDegree(root) {
    var nodes = Array.prototype.slice.call(root.querySelectorAll("h1,h2,h3,h4,p,div,span"));
    return nodes.find(function (el) {
      var t = txt(el);
      return t.indexOf("B.S. Business 3.30 Honors List (111/120)") !== -1 &&
             t.indexOf("Dual Enrollment 60% MBA AI Product") !== -1 &&
             !el.closest(".bp-hardcoded-badge-row");
    });
  }

  function findFashion(root) {
    var nodes = Array.prototype.slice.call(root.querySelectorAll("a,article,section,div"));
    return nodes.find(function (el) {
      var t = txt(el);
      return t.indexOf("Fashion Editorial") !== -1 &&
             t.indexOf("Blair’s Picks") !== -1 &&
             t.indexOf("Luxury fashion product strategy") !== -1 &&
             !el.closest(".bp-hardcoded-badge-row");
    });
  }

  function cleanup() {
    var root = document.querySelector("#mobileContent");
    if (!root) return;

    var rows = Array.prototype.slice.call(root.querySelectorAll(".bp-hardcoded-badge-row"));
    if (!rows.length) return;

    var row = rows[0];
    rows.slice(1).forEach(function (extra) { extra.remove(); });

    row.querySelectorAll(".bp-education-badge-text, .bp-fashion-editorial-badge").forEach(function (el) {
      el.remove();
    });

    Array.prototype.slice.call(row.querySelectorAll(".badge-item")).forEach(function (a) {
      var t = txt(a);
      if (
        t.indexOf("B.S. Business") !== -1 ||
        t.indexOf("Dual Enrollment") !== -1 ||
        t.indexOf("Fashion Editorial") !== -1 ||
        t.indexOf("Blair’s Picks") !== -1 ||
        t.indexOf("Luxury fashion product") !== -1
      ) {
        a.remove();
      }
    });

    var degree = findDegree(root);
    var fashion = findFashion(root);

    if (degree && row && row.parentNode) {
      degree.insertAdjacentElement("afterend", row);
    }

    if (fashion && row && row.parentNode) {
      row.insertAdjacentElement("afterend", fashion);
    }

    /* Remove any smaller duplicate degree text remaining after the real large one. */
    var degreeSeen = false;
    Array.prototype.slice.call(root.querySelectorAll("h1,h2,h3,h4,p,div,span")).forEach(function (el) {
      if (el.closest(".bp-hardcoded-badge-row")) return;
      var t = txt(el);
      if (t.indexOf("B.S. Business 3.30 Honors List (111/120)") !== -1 &&
          t.indexOf("Dual Enrollment 60% MBA AI Product") !== -1) {
        if (!degreeSeen) {
          degreeSeen = true;
        } else if (el.children.length === 0 || el.className.indexOf("bp-education") !== -1) {
          el.remove();
        }
      }
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", cleanup, { once: true });
  } else {
    cleanup();
  }

  window.addEventListener("load", cleanup, { once: true });
  setTimeout(cleanup, 250);
  setTimeout(cleanup, 900);
})();
</script>

<script id="bp-targeted-training-education-course-fit-script">
(function () {
  function textOf(el) {
    return (el && el.textContent ? el.textContent : '').replace(/\s+/g, ' ').trim().toLowerCase();
  }

  function nearestContentBlock(heading) {
    return heading.closest('section, .section, .courses-card, .matrix-card, .card-content, .bp-fused-top-card') || heading.parentElement;
  }

  function applyTargetedPatch() {
    var root = document.querySelector('body.bp-mobile-page #mobileContent');
    if (!root) return;

    /* Technical Training ONLY by heading text */
    Array.prototype.forEach.call(root.querySelectorAll('h1,h2,h3,h4,strong,b'), function (h) {
      if (textOf(h) === 'technical training') {
        var block = nearestContentBlock(h);
        if (block) {
          block.classList.add('bp-target-technical-training');
          Array.prototype.forEach.call(block.querySelectorAll('ul,ol'), function (ul) {
            ul.style.setProperty('text-align', 'left', 'important');
            ul.style.setProperty('list-style-position', 'outside', 'important');
            ul.style.setProperty('padding-left', '1.25rem', 'important');
            ul.style.setProperty('margin-left', '0', 'important');
            ul.style.setProperty('margin-right', '0', 'important');
          });
          Array.prototype.forEach.call(block.querySelectorAll('li, li a, li span'), function (el) {
            el.style.setProperty('text-align', 'left', 'important');
            el.style.setProperty('justify-content', 'flex-start', 'important');
            el.style.setProperty('line-height', '1.38', 'important');
          });
        }
      }
    });

    /* Education descriptions/body only; do not touch title/logo rows */
    Array.prototype.forEach.call(root.querySelectorAll('.edu-card, .education-wrapper .job-details'), function (box) {
      Array.prototype.forEach.call(box.querySelectorAll('.edu-description, .edu-description *, p, li'), function (el) {
        if (el.closest('.edu-header')) return;
        el.style.setProperty('text-align', 'left', 'important');
        el.style.setProperty('margin-left', '0', 'important');
        el.style.setProperty('margin-right', '0', 'important');
        el.style.setProperty('overflow-wrap', 'normal', 'important');
        el.style.setProperty('word-break', 'normal', 'important');
      });
    });

    /* Courses area: size logos only — do not restructure layout */
    Array.prototype.forEach.call(root.querySelectorAll('.course-grid .course-group, .courses-card .course-group, .course-grid .job-layout, .courses-card .job-layout'), function (group) {
      group.style.setProperty('width', '100%', 'important');
      group.style.setProperty('max-width', '100%', 'important');
    });

    Array.prototype.forEach.call(root.querySelectorAll('img'), function (img) {
      var hay = ((img.getAttribute('alt') || '') + ' ' + (img.getAttribute('src') || '')).toLowerCase();
      if (hay.indexOf('lansing') > -1 || hay.indexOf('community college') > -1 || hay.indexOf('mongo') > -1 || hay.indexOf('cloud u') > -1 || hay.indexOf('rackspace cloud') > -1 || hay.indexOf('lcclogo') > -1 || hay.indexOf('mongo1') > -1) {
        ['width','height','min-width','min-height','max-width','max-height'].forEach(function (prop) {
          img.style.setProperty(prop, '44px', 'important');
        });
        img.style.setProperty('object-fit', 'contain', 'important');
        img.style.setProperty('border-radius', '12px', 'important');
        img.style.setProperty('clip-path', 'inset(0 round 12px)', 'important');
        img.style.setProperty('-webkit-clip-path', 'inset(0 round 12px)', 'important');
        var wrap = img.closest('.job-logo, .course-logo');
        if (wrap) {
          ['width','height','min-width','min-height','max-width','max-height'].forEach(function (prop) {
            wrap.style.setProperty(prop, '44px', 'important');
          });
          wrap.style.setProperty('flex', '0 0 44px', 'important');
          wrap.style.setProperty('margin', '0', 'important');
          wrap.style.setProperty('padding', '0', 'important');
          wrap.style.setProperty('align-self', 'start', 'important');
          wrap.style.setProperty('justify-self', 'start', 'important');
        }
      }
    });
  }

  function run() {
    applyTargetedPatch();
    setTimeout(applyTargetedPatch, 80);
    setTimeout(applyTargetedPatch, 300);
    setTimeout(applyTargetedPatch, 900);
    setTimeout(applyTargetedPatch, 1800);
  }

  document.addEventListener('DOMContentLoaded', run);
  window.addEventListener('load', run);
  if (window.MutationObserver) {
    var mo = new MutationObserver(function () { applyTargetedPatch(); });
    document.addEventListener('DOMContentLoaded', function () {
      var root = document.querySelector('#mobileContent') || document.body;
      if (root) mo.observe(root, { childList: true, subtree: true });
    });
  }
})();
</script>

      haystack.includes("cloudu") ||

      haystack.includes("cloud_u") ||
      haystack.includes("rackspace");

      if (!isCloudULogo(img)) return;

      [
        ["width", "46px"],

<script id="bp-safe-volunteer-row-layout">
(function () {
  "use strict";

  function setImportant(el, prop, value) {
    if (el && el.style) el.style.setProperty(prop, value, "important");
  }

  function findVolunteerCards(root) {
    var cards = Array.from(root.querySelectorAll(".volunteer-card"));
    if (cards.length) return cards;

    return Array.from(root.querySelectorAll(".job-layout")).filter(function (layout) {
      var text = (layout.textContent || "").replace(/\s+/g, " ").toLowerCase();
      return text.indexOf("first robotics") !== -1 ||
             text.indexOf("community volunteer") !== -1 ||
             text.indexOf("donna mccoy") !== -1;
    }).map(function (layout) {
      return layout.closest(".timeline-item, .section, .card, div") || layout;
    });
  }

  function fixOneCard(card) {
    if (!card || card.getAttribute("data-bp-volunteer-fixed") === "yes") return;

    var text = (card.textContent || "").replace(/\s+/g, " ").toLowerCase();
    if (text.indexOf("first robotics") === -1 &&
        text.indexOf("community volunteer") === -1 &&
        text.indexOf("donna mccoy") === -1 &&
        text.indexOf("civic engagement") === -1) {
      return;
    }

    var layout = card.querySelector(".job-layout") || card;
    var logo = layout.querySelector(".job-logo") || card.querySelector(".job-logo");
    var img = logo ? logo.querySelector("img") : card.querySelector("img");
    if (!logo && img) logo = img.parentElement;

    var details = layout.querySelector(".job-details") || card.querySelector(".job-details") || layout;

    var heading = null;

<script id="bp-final-strict-volunteer-title-row-fix-script">
(function () {
  "use strict";

  function clean(value) {
    return (value || "").replace(/\s+/g, " ").trim();
  }

  function lower(value) {
    return clean(value).toLowerCase();
  }

  function titleFor(card, img, index) {
    var text = lower(card ? card.textContent : "");
    var alt = lower(img ? img.getAttribute("alt") : "");
    var src = lower(img ? img.getAttribute("src") : "");

    if (alt.indexOf("first") !== -1 || src.indexOf("first") !== -1 || text.indexOf("first robotics") !== -1 || text.indexOf("youth stem") !== -1) {
      return "Judge";
    }
    if (alt.indexOf("swartz") !== -1 || alt.indexOf("community") !== -1 || src.indexOf("swartz") !== -1 || text.indexOf("donna mccoy") !== -1 || text.indexOf("civic engagement") !== -1 || text.indexOf("petitioning") !== -1) {
      return "Community Volunteer";
    }
    return index === 0 ? "Judge" : "Community Volunteer";
  }

  function volunteerSectionRoot(root) {
    var headings = Array.prototype.slice.call(root.querySelectorAll("h1,h2,h3"));
    for (var i = 0; i < headings.length; i += 1) {
      if (lower(headings[i].textContent) === "volunteer work") {
        return headings[i].closest("section, .section, .bp-fused-volunteer, .volunteer-section, .resume-section, div") || headings[i].parentElement || root;
      }
    }
    return root.querySelector(".bp-fused-volunteer") || root;
  }

  function likelyVolunteerCard(el) {
    if (!el || el.nodeType !== 1) return false;
    var text = lower(el.textContent);
    if (text.indexOf("volunteer work") !== -1 && text.length < 40) return false;
    return text.indexOf("first robotics") !== -1 ||
           text.indexOf("youth stem") !== -1 ||
           text.indexOf("donna mccoy") !== -1 ||
           text.indexOf("civic engagement") !== -1 ||
           text.indexOf("petitioning") !== -1;
  }

  function collectCards(root) {
    var section = volunteerSectionRoot(root);
    var cards = Array.prototype.slice.call(section.querySelectorAll(".volunteer-card, .job-layout, .timeline-item, article, .card"))
      .filter(likelyVolunteerCard);

    if (!cards.length) {
      cards = Array.prototype.slice.call(section.querySelectorAll("img")).map(function (img) {
        return img.closest(".volunteer-card, .job-layout, .timeline-item, article, .card, div") || img.parentElement;
      }).filter(function (card, pos, arr) {
        return card && likelyVolunteerCard(card) && arr.indexOf(card) === pos;
      });
    }

    cards.sort(function (a, b) {
      if (a === b) return 0;
      var pos = a.compareDocumentPosition(b);
      return pos & Node.DOCUMENT_POSITION_FOLLOWING ? -1 : 1;
    });

    return cards;
  }

  function firstVolunteerImage(card) {
    var imgs = Array.prototype.slice.call(card.querySelectorAll("img"));
    return imgs.find(function (img) {
      var alt = lower(img.getAttribute("alt"));
      var src = lower(img.getAttribute("src"));
      return alt.indexOf("first") !== -1 || alt.indexOf("swartz") !== -1 || alt.indexOf("community") !== -1 || src.indexOf("first") !== -1 || src.indexOf("swartz") !== -1;
    }) || imgs[0] || null;
  }

  function removeOldInjectedTitles(card) {
    Array.prototype.forEach.call(card.querySelectorAll(".bp-volunteer-side-title, .bp-final-volunteer-title-text"), function (old) {
      var row = old.closest(".bp-final-volunteer-title-row");
      if (row) return;
      old.parentNode.removeChild(old);
    });
  }

  function fixCard(card, index) {
    if (!card) return;
    var img = firstVolunteerImage(card);
    if (!img) return;

    var title = titleFor(card, img, index);
    var layout = card.classList && card.classList.contains("job-layout") ? card : (card.querySelector(".job-layout") || card);
    var logo = img.closest(".job-logo") || img.parentElement;
    var existingRow = card.querySelector(".bp-final-volunteer-title-row");

    removeOldInjectedTitles(card);

    var row = existingRow || document.createElement("div");
    row.className = "bp-final-volunteer-title-row";

    var titleEl = row.querySelector(".bp-final-volunteer-title-text") || document.createElement("div");
    titleEl.className = "bp-final-volunteer-title-text";
    titleEl.textContent = title;

    if (!existingRow) {
      var insertBefore = layout.firstElementChild || layout.firstChild;
      layout.insertBefore(row, insertBefore);
    }

    if (logo && logo.parentNode !== row) row.appendChild(logo);
    if (!logo && img.parentNode !== row) row.appendChild(img);
    if (titleEl.parentNode !== row) row.appendChild(titleEl);

    card.classList.add("bp-final-volunteer-card-fixed");
    layout.classList.add("bp-final-volunteer-layout-fixed");
  }

  function run() {
    var root = document.getElementById("mobileContent") || document;
    collectCards(root).slice(0, 2).forEach(fixCard);
  }

  function schedule() {
    run();
    [80, 180, 350, 700, 1200, 2000, 3500, 5200, 7000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }

  window.addEventListener("load", schedule, { passive: true });
})();
</script>

<script id="bp-index-parity-collapse-expand-script">
(function () {
  "use strict";

  function setIcon(el, open) {
    if (!el) return;
    el.textContent = open ? "−" : "+";
    el.style.setProperty("transform", "none", "important");
    el.style.setProperty("rotate", "0deg", "important");
  }

  function collapseMatrixDefaults(root) {
    root.querySelectorAll(".matrix-card").forEach(function (card) {
      var btn = card.querySelector(".card-toggle");
      var content = card.querySelector(".card-content");
      var icon = btn && (btn.querySelector(".expand-icon") || btn.querySelector("span:last-child"));
      var wantOpen =
        card.classList.contains("open") &&
        btn &&
        btn.getAttribute("aria-expanded") === "true";

      // Fresh pull: force closed like desktop initial state unless already user-opened
      if (!card.dataset.bpUserToggled) {
        wantOpen = false;
      }

      card.classList.toggle("open", wantOpen);
      if (btn) btn.setAttribute("aria-expanded", String(wantOpen));
      if (content) {
        content.hidden = !wantOpen;
        content.style.setProperty("display", wantOpen ? "block" : "none", "important");
      }
      if (icon) {
        icon.classList.add("expand-icon");
        setIcon(icon, wantOpen);
      }
    });
  }

  function wireMatrix(root) {
    root.querySelectorAll(".matrix-card > .card-toggle, .matrix-card .card-toggle").forEach(function (button) {
      if (button.dataset.bpIndexParityWired === "true") return;
      button.dataset.bpIndexParityWired = "true";

      button.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        var card = button.closest(".matrix-card");
        if (!card) return;
        card.dataset.bpUserToggled = "1";
        var content = card.querySelector(".card-content");
        var icon = button.querySelector(".expand-icon") || button.querySelector("span:last-child");
        var open = button.getAttribute("aria-expanded") !== "true";

        card.classList.toggle("open", open);
        button.setAttribute("aria-expanded", String(open));
        if (content) {
          content.hidden = !open;
          content.style.setProperty("display", open ? "block" : "none", "important");
        }
        if (icon) {
          icon.classList.add("expand-icon");
          setIcon(icon, open);
        }
      }, true);
    });
  }

  function isSelectedProjects(title) {
    return ((title && title.textContent) || "").indexOf("Selected Projects") !== -1;
  }

  function findRoleList(job, heading) {
    var list =
      (heading.closest && heading.closest(".job-toggle-row") && heading.closest(".job-toggle-row").nextElementSibling) ||
      heading.nextElementSibling;
    while (list && list.tagName !== "UL" && list.tagName !== "H4" && list.tagName !== "H3") {
      list = list.nextElementSibling;
    }
    if (list && list.tagName === "UL") return list;
    // fallback: first UL in job that is not under .job-projects
    var lists = job.querySelectorAll(":scope > ul, :scope > .job-list-collapsible");
    for (var i = 0; i < lists.length; i++) {
      if (!lists[i].closest(".job-projects")) return lists[i];
    }
    return null;
  }

  function wireJobs(root) {
    root.querySelectorAll(".job-details").forEach(function (job) {
      if (job.dataset.bpIndexParityJobs === "true") return;

      var headings = Array.prototype.slice.call(
        job.querySelectorAll(":scope > h4, :scope > h3, :scope > .job-toggle-row > h4, :scope > .job-click > h4, :scope > .job-click > h3")
      );

      // If job-click wrappers already exist from earlier mobile code, re-bind cleanly
      var existingClicks = Array.prototype.slice.call(job.querySelectorAll(":scope > .job-click"));
      if (existingClicks.length) {
        existingClicks.forEach(function (row) {
          if (row.dataset.bpIndexParityWired === "true") return;
          row.dataset.bpIndexParityWired = "true";

          var icon = row.querySelector(".job-plus, .job-expand-btn, .expand-icon");
          var list = row.nextElementSibling;
          while (list && list.tagName !== "UL") list = list.nextElementSibling;
          if (!list) return;

          var titleEl = row.querySelector("h4, h3");
          if (titleEl && isSelectedProjects(titleEl)) {
            list.classList.add("expanded");
            list.hidden = false;
            list.style.setProperty("display", "block", "important");
            setIcon(icon, true);
            row.setAttribute("aria-expanded", "true");
            return;
          }

          list.classList.add("job-list-collapsible");
          list.classList.remove("expanded");
          list.hidden = true;
          list.style.setProperty("display", "none", "important");
          row.setAttribute("aria-expanded", "false");
          setIcon(icon, false);

          function toggle() {
            var open = row.getAttribute("aria-expanded") !== "true";
            row.setAttribute("aria-expanded", String(open));
            list.classList.toggle("expanded", open);
            list.hidden = !open;
            list.style.setProperty("display", open ? "block" : "none", "important");
            setIcon(icon, open);
            row.style.background = open ? "rgba(158,130,156,0.10)" : "transparent";
          }

          row.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            toggle();
          }, true);
          row.addEventListener("keydown", function (e) {
            if (e.key !== "Enter" && e.key !== " ") return;
            e.preventDefault();
            toggle();
          }, true);
        });
        job.dataset.bpIndexParityJobs = "true";
        return;
      }

      headings.forEach(function (heading) {
        if (isSelectedProjects(heading)) {
          var keep = findRoleList(job, heading);
          if (keep) {
            keep.classList.add("expanded");
            keep.hidden = false;
            keep.style.setProperty("display", "block", "important");
          }
          return;
        }

        var list = findRoleList(job, heading);
        if (!list) return;

        var row = heading.closest(".job-toggle-row");
        if (!row) {
          row = document.createElement("div");
          row.className = "job-click";
          row.tabIndex = 0;
          row.setAttribute("role", "button");
          var icon = document.createElement("span");
          icon.className = "job-plus";
          icon.setAttribute("aria-hidden", "true");
          list.parentNode.insertBefore(row, list);
          row.appendChild(icon);
          row.appendChild(heading);
        }

        var icon = row.querySelector(".job-plus, .job-expand-btn, .expand-icon");
        if (!icon) {
          icon = document.createElement("span");
          icon.className = "job-plus";
          row.insertBefore(icon, row.firstChild);
        }

        list.classList.add("job-list-collapsible");
        list.classList.remove("expanded");
        list.hidden = true;
        list.style.setProperty("display", "none", "important");
        row.setAttribute("aria-expanded", "false");
        setIcon(icon, false);

        if (row.dataset.bpIndexParityWired === "true") return;
        row.dataset.bpIndexParityWired = "true";

        function toggle() {
          var open = row.getAttribute("aria-expanded") !== "true";
          row.setAttribute("aria-expanded", String(open));
          list.classList.toggle("expanded", open);
          list.hidden = !open;
          list.style.setProperty("display", open ? "block" : "none", "important");
          setIcon(icon, open);
          row.style.background = open ? "rgba(158,130,156,0.10)" : "transparent";
        }

        row.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          toggle();
        }, true);
        row.addEventListener("keydown", function (e) {
          if (e.key !== "Enter" && e.key !== " ") return;
          e.preventDefault();
          toggle();
        }, true);
      });

      job.dataset.bpIndexParityJobs = "true";
    });
  }

  function run(root) {
    root = root || document.getElementById("mobileContent") || document;
    try {
      collapseMatrixDefaults(root);
      wireMatrix(root);
      wireJobs(root);
    } catch (e) {}
  }

  function schedule() {
    run();
    [120, 350, 700, 1200, 2000, 3500, 5500].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  // Re-run after mobile content is injected into #mobileContent
  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () {
      schedule();
    });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () {
      try { mo.disconnect(); } catch (e) {}
    }, 12000);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });
})();
</script>

<script id="bp-bak-marque-and-screen-fit-script">
(function () {
  "use strict";

  var jsMarqueActive = false;
  var jsMarqueRaf = null;

  function fitUnderMarque(root) {
    if (!root) return;
    [document.documentElement, document.body].forEach(function (el) {
      if (!el) return;
      el.style.setProperty("overflow-x", "hidden", "important");
      el.style.setProperty("max-width", "100vw", "important");
      el.style.setProperty("width", "100%", "important");
    });
    var shell = document.getElementById("mobileShell") || document.querySelector(".mobile-shell");
    if (shell) {
      shell.style.setProperty("overflow-x", "hidden", "important");
      shell.style.setProperty("max-width", "100%", "important");
      shell.style.setProperty("width", "100%", "important");
    }
    root.style.setProperty("overflow-x", "hidden", "important");
    root.style.setProperty("max-width", "100%", "important");
    root.style.setProperty("width", "100%", "important");

    var blocks = root.querySelectorAll(
      ".resume-shell, .container, .bp-fused-top-card, .identity-row, .identity-info, " +
      ".profile-matrix, .matrix-grid, .matrix-card, .card-content, .timeline, .timeline-item, " +
      ".job-layout, .job-details, .education-wrapper, .edu-card, .course-grid, .courses-card, " +
      ".certification-list, .cert-card, .certification-card, .volunteer-grid, .volunteer-card, " +
      ".resume-sections, section"
    );
    Array.prototype.forEach.call(blocks, function (el) {
      if (el.classList && el.classList.contains("enterprise-brand-slider")) {
        el.style.setProperty("width", "100%", "important");
        el.style.setProperty("max-width", "100%", "important");
        el.style.setProperty("overflow", "hidden", "important");
        return;
      }
      if (el.closest && el.closest(".enterprise-brand-slider")) return;
      if (el.closest && el.closest(".bp-hardcoded-badge-row")) return;
      el.style.setProperty("width", "100%", "important");
      el.style.setProperty("max-width", "100%", "important");
      el.style.setProperty("min-width", "0", "important");
      el.style.setProperty("overflow-x", "hidden", "important");
      el.style.setProperty("box-sizing", "border-box", "important");
    });
  }

  function setupMarque(root) {
    if (!root) return;
    var slider = root.querySelector(".enterprise-brand-slider");
    if (!slider) return;

    var viewport = slider.querySelector(".enterprise-brand-slider__viewport") || slider;
    var track = slider.querySelector(".enterprise-brand-slider__track");
    if (!track) return;

    var sets = track.querySelectorAll(":scope > .enterprise-brand-slider__set");
    if (sets.length === 1) {
      var clone = sets[0].cloneNode(true);
      clone.setAttribute("aria-hidden", "true");
      track.appendChild(clone);
    }

    slider.style.setProperty("width", "100%", "important");
    slider.style.setProperty("max-width", "100%", "important");
    slider.style.setProperty("overflow", "hidden", "important");
    viewport.style.setProperty("width", "100%", "important");
    viewport.style.setProperty("overflow", "hidden", "important");

    track.style.setProperty("display", "flex", "important");
    track.style.setProperty("flex-direction", "row", "important");
    track.style.setProperty("flex-wrap", "nowrap", "important");
    track.style.setProperty("align-items", "center", "important");
    track.style.setProperty("width", "max-content", "important");
    track.style.setProperty("animation-name", "enterpriseBrandScroll", "important");
    track.style.setProperty("animation-duration", "52s", "important");
    track.style.setProperty("animation-timing-function", "linear", "important");
    track.style.setProperty("animation-iteration-count", "infinite", "important");
    track.style.setProperty("animation-play-state", "running", "important");

    track.querySelectorAll(":scope > .enterprise-brand-slider__set").forEach(function (set) {
      set.style.setProperty("display", "flex", "important");
      set.style.setProperty("flex-wrap", "nowrap", "important");
      set.style.setProperty("flex-shrink", "0", "important");
      set.style.setProperty("align-items", "center", "important");
    });

    track.querySelectorAll(".enterprise-brand-slider__item").forEach(function (item) {
      item.style.setProperty("flex", "0 0 150px", "important");
      item.style.setProperty("width", "150px", "important");
      item.style.setProperty("min-width", "150px", "important");
      item.style.setProperty("height", "52px", "important");
      item.style.setProperty("display", "flex", "important");
      item.style.setProperty("align-items", "center", "important");
      item.style.setProperty("justify-content", "center", "important");
    });

    // JS fallback if CSS animation is not applied
    if (jsMarqueActive) return;
    var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) return;

    setTimeout(function () {
      var cs = window.getComputedStyle(track);
      var name = (cs.animationName || "").toString();
      if (name && name !== "none") return;

      jsMarqueActive = true;
      var start = null;
      var duration = 52000;
      function frame(ts) {
        if (start === null) start = ts;
        var pct = ((ts - start) % duration) / duration;
        track.style.setProperty("animation", "none", "important");
        track.style.setProperty("transform", "translate3d(" + (-pct * 50) + "%, 0, 0)", "important");
        jsMarqueRaf = requestAnimationFrame(frame);
      }
      if (jsMarqueRaf) cancelAnimationFrame(jsMarqueRaf);
      jsMarqueRaf = requestAnimationFrame(frame);
    }, 500);
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    fitUnderMarque(root);
    setupMarque(root);
  }

  function schedule() {
    run();
    [150, 400, 900, 1600, 2800, 4500, 7000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 14000);
  }
})();
</script>

<script id="bp-nuclear-screen-fit-script">
(function () {
  "use strict";

  function clampOverflow(root) {
    if (!root) return;
    var vw = Math.min(window.innerWidth || 400, document.documentElement.clientWidth || 400);

    [document.documentElement, document.body, document.getElementById("mobileShell"), root].forEach(function (el) {
      if (!el || !el.style) return;
      el.style.setProperty("overflow-x", "hidden", "important");
      el.style.setProperty("max-width", el === document.documentElement || el === document.body ? "100vw" : "100%", "important");
      el.style.setProperty("width", "100%", "important");
    });

    // resume-shell must clip
    var shell = root.querySelector(".resume-shell");
    if (shell) {
      shell.style.setProperty("overflow-x", "hidden", "important");
      shell.style.setProperty("overflow", "hidden", "important");
      shell.style.setProperty("max-width", "100%", "important");
      shell.style.setProperty("width", "100%", "important");
      shell.style.setProperty("min-width", "0", "important");
    }

    // Any element (except marque track internals) that is wider than viewport gets clamped
    var all = root.querySelectorAll("div, section, article, ul, ol, table, p, h1, h2, h3, h4, span, a");
    Array.prototype.forEach.call(all, function (el) {
      if (!el || !el.getBoundingClientRect) return;
      if (el.closest && el.closest(".enterprise-brand-slider__track")) return;
      if (el.closest && el.closest(".bp-hardcoded-badge-row")) return;
      try {
        var r = el.getBoundingClientRect();
        if (r.width > vw + 2) {
          el.style.setProperty("max-width", "100%", "important");
          el.style.setProperty("width", "100%", "important");
          el.style.setProperty("min-width", "0", "important");
          el.style.setProperty("box-sizing", "border-box", "important");
          el.style.setProperty("overflow-x", "hidden", "important");
        }
      } catch (e) {}
    });
  }

  function run() {
    var root = document.getElementById("mobileContent");
    clampOverflow(root);
  }

  function schedule() {
    run();
    [100, 300, 700, 1200, 2000, 3500, 5500, 8000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });
  window.addEventListener("resize", function () { setTimeout(run, 50); }, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 15000);
  }
})();
</script>

<script id="bp-userfix-marquee-touch-scroll-script">
(function () {
  "use strict";

  var intervalStarted = false;

  function forceScrollable(viewport) {
    if (!viewport) return;
    if (viewport.style.overflowX !== "auto") {
      viewport.style.setProperty("overflow-x", "auto", "important");
      viewport.style.setProperty("overflow-y", "hidden", "important");
    }
    if (viewport.style.touchAction !== "pan-x") {
      viewport.style.setProperty("touch-action", "pan-x", "important");
    }
    if (viewport.style.getPropertyValue("-webkit-overflow-scrolling") !== "touch") {
      viewport.style.setProperty("-webkit-overflow-scrolling", "touch", "important");
    }
  }

  function setup(viewport, track) {
    if (!viewport || !track) return;

    forceScrollable(viewport);

    if (viewport.getAttribute("data-bp-touch-bound") === "yes") return;
    viewport.setAttribute("data-bp-touch-bound", "yes");

    var resumeTimer = null;

    function pause() {
      track.style.setProperty("animation-play-state", "paused", "important");
    }

    function scheduleResume() {
      if (resumeTimer) clearTimeout(resumeTimer);
      resumeTimer = setTimeout(function () {
        track.style.setProperty("animation-play-state", "running", "important");
      }, 2200);
    }

    ["touchstart", "pointerdown", "mouseenter"].forEach(function (evt) {
      viewport.addEventListener(evt, pause, { passive: true });
    });
    ["touchend", "touchcancel", "pointerup", "mouseleave", "scroll"].forEach(function (evt) {
      viewport.addEventListener(evt, scheduleResume, { passive: true });
    });

    // Another script on this page keeps resetting this element's inline
    // "overflow" back to hidden on a timer, which silently kills the
    // touch-scroll. Watch for that and correct it immediately whenever it
    // happens, instead of relying on our own timed schedule alone.
    if (window.MutationObserver) {
      var styleWatcher = new MutationObserver(function () {
        forceScrollable(viewport);
      });
      styleWatcher.observe(viewport, { attributes: true, attributeFilter: ["style"] });
    }
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    var slider = root.querySelector(".enterprise-brand-slider");
    if (!slider) return;
    var viewport = slider.querySelector(".enterprise-brand-slider__viewport") || slider;
    var track = slider.querySelector(".enterprise-brand-slider__track");
    setup(viewport, track);
  }

  function schedule() {
    run();
    [200, 500, 1000, 2000, 3500, 5500, 8000].forEach(function (ms) {
      setTimeout(run, ms);
    });
    if (!intervalStarted) {
      intervalStarted = true;
      // Only reassert occasionally; skip while user is scrolling to avoid blink
      setInterval(function () {
        if (document.body.classList.contains("bp-is-scrolling")) return;
        if (document.documentElement.classList.contains("bp-scroll-stable-settled")) {
          // After settle, run much less often
          if (!window.__bpMarqueeTick) window.__bpMarqueeTick = 0;
          window.__bpMarqueeTick++;
          if (window.__bpMarqueeTick % 8 !== 0) return;
        }
        run();
      }, 1200);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });
})();
</script>

<script id="bp-userfix-marquee-icon-text-fix">
(function () {
  "use strict";

  // The visible gap in "Game Crazy" / "V imeo" isn't a stray space
  // character sitting in one text node — these labels are split across
  // sibling elements inside the item's wrapping span (same pattern as the
  // other multi-part brand marks), and that span has a flex "gap" between
  // its children. A plain text-node regex can't see across element
  // boundaries, so instead we look at each item's fully-collapsed text and,
  // when it matches one of these two brands, rewrite it as a single clean
  // text node inside the existing (or a fresh) label span. That removes the
  // inter-element gap entirely while keeping the same font size/color/etc.
  // that ">span" already gets from the marquee's own styling.

  var wordFixes = {
    "gamecrazy": "GameCrazy",
    "vimeo": "Vimeo"
  };

  function normalizeKey(s) {
    return (s || "").replace(/\s+/g, "").toLowerCase();
  }

  function fixItem(item) {
    var desired = wordFixes[normalizeKey(item.textContent)];
    if (!desired) return;
    if (item.getAttribute("data-bp-label-fixed") === desired) return;

    var span = item.querySelector(":scope > span");
    if (!span) {
      span = document.createElement("span");
      item.appendChild(span);
    }

    // Drop every other direct child of the item (any stray icon/text nodes
    // sitting outside the label span) and collapse the label span itself
    // down to one plain text node.
    Array.prototype.slice.call(item.childNodes).forEach(function (n) {
      if (n !== span) item.removeChild(n);
    });
    span.style.setProperty("gap", "0", "important");
    span.textContent = desired;

    item.setAttribute("data-bp-label-fixed", desired);
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    var slider = root.querySelector(".enterprise-brand-slider");
    if (!slider) return;
    Array.prototype.forEach.call(
      slider.querySelectorAll(".enterprise-brand-slider__item"),
      fixItem
    );
  }

  function schedule() {
    run();
    [200, 500, 1000, 2000, 3500, 5500, 8000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () {
      run();
    });
    mo.observe(host, { childList: true, subtree: true, characterData: true });
    setTimeout(function () {
      try { mo.disconnect(); } catch (e) {}
    }, 16000);
  }
})();
</script>

<script id="bp-userfix-judge-remove-lansing-duplicate">
(function () {
  "use strict";

  function norm(v) {
    return (v || "").toLowerCase();
  }

  function isLansingImg(img) {
    var alt = norm(img.getAttribute("alt"));
    var src = norm(img.getAttribute("src"));
    return alt.indexOf("lansing") !== -1 ||
           alt.indexOf("community college") !== -1 ||
           src.indexOf("lansing") !== -1 ||
           src.indexOf("lcclogo") !== -1;
  }

  function volunteerSectionRoot(root) {
    var headings = root.querySelectorAll("h2, h3");
    for (var i = 0; i < headings.length; i++) {
      if ((headings[i].textContent || "").trim().toLowerCase() === "volunteer work") {
        return headings[i].closest("section, .section, .bp-fused-volunteer, .volunteer-section, .resume-section, div") || headings[i].parentElement || root;
      }
    }
    return root.querySelector(".bp-fused-volunteer") || root;
  }

  function isJudgeCard(el) {
    var t = norm(el.textContent);
    return t.indexOf("judge") !== -1 ||
           t.indexOf("first robotics") !== -1 ||
           t.indexOf("youth stem") !== -1;
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    var section = volunteerSectionRoot(root);
    if (!section) return;
    // Never operate on courses / technical training (LCC logo belongs there)
    if (section.closest && (section.closest(".course-grid, .courses-card") || section.querySelector(".course-grid, .courses-card"))) {
      // Only walk volunteer cards inside this section, not course blocks
    }

    var cards = section.querySelectorAll(".volunteer-card, .job-layout, .timeline-item, article, .card");
    Array.prototype.forEach.call(cards, function (card) {
      if (!isJudgeCard(card)) return;
      // Hard guard: do not touch anything inside technical training / courses
      if (card.closest(".course-grid, .courses-card, .course-group, .courses-section")) return;
      if (card.querySelector(".course-grid, .courses-card, .course-title")) return;

      var imgs = Array.prototype.slice.call(card.querySelectorAll("img"));
      if (imgs.length < 2) return;

      imgs.forEach(function (img) {
        if (!isLansingImg(img)) return;
        // Extra guard: image inside courses area is sacred
        if (img.closest(".course-grid, .courses-card, .course-group")) return;
        var logoWrap = img.closest(".job-logo");
        if (img.parentNode) img.parentNode.removeChild(img);
        if (logoWrap && logoWrap.parentNode && !logoWrap.querySelector("img")) {
          logoWrap.parentNode.removeChild(logoWrap);
        }
      });
    });
  }

  function schedule() {
    run();
    [200, 500, 1000, 1800, 3000, 4500, 6500, 9000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () {
      run();
    });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () {
      try { mo.disconnect(); } catch (e) {}
    }, 14000);
  }
})();
</script>

      list.classList.toggle("expanded", open);
      list.hidden = !open;

      setIcon(icon, open);
      setImportant(row, "background", open ? "rgba(158,130,156,0.10)" : "transparent");
    }

    row.addEventListener("click", toggle, true);
    row.addEventListener("keydown", function (e) {
      if (e.key !== "Enter" && e.key !== " ") return;

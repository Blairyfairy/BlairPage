<script id="bp-remerge-marquee-circular-buffer">
(function () {
  "use strict";

  function ensureDualSets(track) {
    if (!track) return null;
    var sets = track.querySelectorAll(":scope > .enterprise-brand-slider__set");
    if (!sets.length) return null;
    while (sets.length < 2) {
      var clone = sets[0].cloneNode(true);
      clone.setAttribute("aria-hidden", "true");
      track.appendChild(clone);
      sets = track.querySelectorAll(":scope > .enterprise-brand-slider__set");
    }
    return sets[0];
  }

  function bindCircular(viewport, track) {
    if (!viewport || !track) return;
    if (viewport.getAttribute("data-bp-circular-bound") === "yes") return;
    viewport.setAttribute("data-bp-circular-bound", "yes");

    var wrapping = false;

    function setWidth() {
      var first = ensureDualSets(track);
      if (!first) return 0;
      return first.offsetWidth || first.scrollWidth || 0;
    }

    function wrapScroll() {
      if (wrapping) return;
      var w = setWidth();
      if (w <= 0) return;
      var sl = viewport.scrollLeft;
      if (sl >= w) {
        wrapping = true;
        viewport.scrollLeft = sl - w;
        wrapping = false;
        return;
      }
      if (sl <= 0) {
        wrapping = true;
        viewport.scrollLeft = sl + w;
        wrapping = false;
      }
    }

    viewport.addEventListener("scroll", wrapScroll, { passive: true });
    ["touchend", "touchcancel", "pointerup", "mouseup"].forEach(function (evt) {
      viewport.addEventListener(evt, function () {
        requestAnimationFrame(function () {
          wrapScroll();
          setTimeout(wrapScroll, 50);
          setTimeout(wrapScroll, 180);
        });
      }, { passive: true });
    });
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    var slider = root.querySelector(".enterprise-brand-slider");
    if (!slider) return;
    var viewport = slider.querySelector(".enterprise-brand-slider__viewport") || slider;
    var track = slider.querySelector(".enterprise-brand-slider__track");
    if (!track) return;
    ensureDualSets(track);
    bindCircular(viewport, track);
  }

  function schedule() {
    run();
    [200, 500, 1000, 2000, 3500, 5500, 8000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 16000);
  }
})();
</script>

    if (wrap) {

  function ensureLccLogo(root) {

    var src = resolveLccSrc(root);

    areas.forEach(function (area) {
      var group = findLansingGroup(area);
      if (!group) return;

      // Already has a Lansing / lcclogo image inside this courses group
      var existing = group.querySelector(
        'img[alt*="Lansing" i], img[alt*="Community College" i], img[src*="lcclogo" i]'

      var px = referenceLogoSize(area);

      if (existing) {

        var wrap = existing.closest(".job-logo, .course-logo");
        applyLogoBox(existing, wrap, px);
        setImp(existing, "display", "block");
        setImp(existing, "visibility", "visible");

      }

      // Insert logo matching sibling school structure (job-logo + img)
      var wrap = document.createElement("div");

        group.insertBefore(wrap, title);
      } else {
        group.insertBefore(wrap, group.firstChild);
      }

      applyLogoBox(img, wrap, px);

      // If src 404, try alternate common paths once
      img.onerror = function () {
        if (img.dataset.bpLccTried === "1") return;
        img.dataset.bpLccTried = "1";
        var alts = [
          "lcclogo.jpg",
          "./lcclogo.jpg",
          "images/lcclogo.jpg",
          "./images/lcclogo.jpg",
          "assets/lcclogo.jpg"
        ];
        var next = alts.filter(function (a) { return a !== img.src; })[0];
        if (next) img.src = next;
      };
    });
  }

    var root = document.getElementById("mobileContent");

      whiteTitles(root);

      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {

    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");

    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });

<script id="bp-courses-logo-inside-card-white-titles-script">
(function () {
  "use strict";

  function lower(s) {
    return (s || "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  function setImp(el, prop, val) {
    if (el && el.style) el.style.setProperty(prop, val, "important");
  }

  function isSchoolTitleText(t) {
    return (
      t.indexOf("lansing community college") !== -1 ||
      t.indexOf("mongodb university") !== -1 ||
      t.indexOf("rackspace cloud university") !== -1 ||
      t === "mongodb university" ||
      t === "lansing community college" ||
      t.indexOf("cloud university") !== -1
    );
  }

  function forceWhiteTitles(root) {
    var nodes = root.querySelectorAll(
      ".course-title, .course-header, .course-group h3, .course-group h4, .course-header h3, .course-header h4, h3, h4, a, span, strong, b, p, div"
    );
    Array.prototype.forEach.call(nodes, function (el) {
      // Only leaf-ish title lines, not huge containers
      var t = lower(el.textContent);
      if (!isSchoolTitleText(t)) return;
      if ((el.textContent || "").length > 80) return;
      // Must live under courses area
      if (!el.closest(".course-grid, .courses-card, .course-group, .courses-section")) {
        // also allow if parent section is titled Courses / Technical Training
        var sec = el.closest("section, .section");
        if (!sec) return;
        var h = sec.querySelector("h2, h3");
        var ht = lower(h && h.textContent);
        if (ht !== "courses" && ht !== "technical training") return;
      }
      setImp(el, "color", "#f0eff4");
      setImp(el, "-webkit-text-fill-color", "#f0eff4");
      // wipe class-driven greens/purples on this node
      el.classList.remove("uopeople-purple");
      Array.prototype.forEach.call(el.querySelectorAll("*"), function (child) {
        if (lower(child.textContent).length > 80) return;
        setImp(child, "color", "#f0eff4");
        setImp(child, "-webkit-text-fill-color", "#f0eff4");
      });
    });
  }

  function findTitleEl(root, needle) {
    var nodes = root.querySelectorAll(".course-title, h3, h4, a, span, strong, p, div");
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      var t = lower(el.textContent);
      if (t.indexOf(needle) === -1) continue;
      if ((el.textContent || "").length > 80) continue;
      return el;
    }
    return null;
  }

  function findSchoolCard(titleEl) {
    if (!titleEl) return null;
    // Prefer explicit course-group / card wrappers
    var card =
      titleEl.closest(".course-group") ||
      titleEl.closest(".job-layout") ||
      titleEl.closest("article") ||
      titleEl.closest(".card") ||
      titleEl.closest("[class*='course']");
    if (card) return card;

    // Walk up until we find a rounded/padded card-like parent that contains the list
    var el = titleEl.parentElement;
    for (var depth = 0; el && depth < 8; depth++) {
      var hasList = el.querySelector("ul, ol, li");
      var style = window.getComputedStyle(el);
      var radius = parseFloat(style.borderRadius) || 0;
      if (hasList && (radius >= 8 || el.className)) {
        return el;
      }
      el = el.parentElement;
    }
    return titleEl.parentElement;
  }

  function isLccImg(img) {
    var alt = lower(img.getAttribute("alt"));
    var src = lower(img.getAttribute("src"));
    return (
      alt.indexOf("lansing") !== -1 ||
      alt.indexOf("community college") !== -1 ||
      src.indexOf("lcclogo") !== -1 ||
      src.indexOf("lansing") !== -1
    );
  }

  function sizeLikeMongo(img, card) {
    var mongo = card
      ? null
      : null;
    // Prefer global mongo size under courses
    var root = document.getElementById("mobileContent") || document;
    var ref =
      root.querySelector(
        '.course-grid img[alt*="MongoDB" i], .courses-card img[alt*="MongoDB" i], img[src*="mongo1" i]'
      ) || root.querySelector('img[alt*="MongoDB" i]');
    var px = 50;
    if (ref) {
      var w = parseInt(window.getComputedStyle(ref).width, 10);
      if (w && w > 0 && w < 120) px = w;
    }
    var size = px + "px";
    ["width", "height", "min-width", "min-height", "max-width", "max-height"].forEach(function (p) {
      setImp(img, p, size);
    });
    setImp(img, "object-fit", "contain");
    setImp(img, "display", "block");
    setImp(img, "margin", "0 auto");
    setImp(img, "border-radius", "12px");
    var wrap = img.closest(".job-logo, .course-logo");
    if (wrap) {
      ["width", "height", "min-width", "min-height", "max-width", "max-height"].forEach(function (p) {
        setImp(wrap, p, size);
      });
      setImp(wrap, "margin", "0 auto 0.55rem auto");
      setImp(wrap, "display", "flex");
      setImp(wrap, "justify-content", "center");
      setImp(wrap, "align-items", "center");
    }
  }

  function moveLccLogoInsideCard(root) {
    var title = findTitleEl(root, "lansing community college");
    if (!title) return;
    var card = findSchoolCard(title);
    if (!card) return;

    // Logo currently inside card?
    var inside = card.querySelector("img");
    var lccInside = null;
    Array.prototype.forEach.call(card.querySelectorAll("img"), function (img) {
      if (isLccImg(img)) lccInside = img;
    });

    // Logo anywhere near courses / before card
    var lccOutside = null;
    Array.prototype.forEach.call(root.querySelectorAll("img"), function (img) {
      if (!isLccImg(img)) return;
      if (card.contains(img)) return;
      // Prefer images that are siblings/near the courses section
      lccOutside = img;
    });

    var img = lccInside || lccOutside;
    if (!img) {
      // Create if completely missing
      var wrap = document.createElement("div");
      wrap.className = "job-logo";
      img = document.createElement("img");
      img.alt = "Lansing Community College";
      img.src = "lcclogo.jpg";
      img.className = "logo-img";
      wrap.appendChild(img);
      card.insertBefore(wrap, card.firstChild);
      sizeLikeMongo(img, card);
      return;
    }

    var wrap = img.closest(".job-logo, .course-logo") || img;

    // Move into card as first child (same structural position as MongoDB logo)
    if (!card.contains(img)) {
      card.insertBefore(wrap, card.firstChild);
    } else if (card.firstElementChild !== wrap && card.firstElementChild !== img) {
      card.insertBefore(wrap, card.firstChild);
    }

    sizeLikeMongo(img, card);
    setImp(img, "visibility", "visible");
    setImp(img, "opacity", "1");
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    try {
      moveLccLogoInsideCard(root);
      forceWhiteTitles(root);
    } catch (e) {}
  }

  function schedule() {
    run();
    [80, 200, 500, 1000, 1800, 3000, 5000, 8000, 12000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 16000);
  }
})();
</script>

    return false;
  }

  function coursesContainers(root) {
    var list = Array.prototype.slice.call(root.querySelectorAll(".course-grid, .courses-card"));
    if (list.length) return list;
    Array.prototype.forEach.call(root.querySelectorAll("h2, h3"), function (h) {
      var t = lower(h.textContent);
      if (t === "courses" || t === "technical training") {
        var sec = h.closest("section, .section, div") || h.parentElement;
        if (sec && !isVolunteerZone(sec)) list.push(sec);
      }
    });
    return list;
  }

  function isLccImg(img) {
    var alt = lower(img.getAttribute("alt"));
    var src = lower(img.getAttribute("src"));
    return (
      alt.indexOf("lansing") !== -1 ||
      alt.indexOf("community college") !== -1 ||
      src.indexOf("lcclogo") !== -1 ||
      src.indexOf("lansing") !== -1
    );
  }

  function stripLccFromVolunteer(root) {
    // Remove LCC logos that landed in volunteer
    Array.prototype.forEach.call(root.querySelectorAll("img"), function (img) {
      if (!isLccImg(img)) return;
      if (!isVolunteerZone(img)) return;
      var wrap = img.closest(".job-logo, .course-logo") || img;
      if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
    });

    // Remove stray "Lansing Community College" title nodes in volunteer only
    Array.prototype.forEach.call(
      root.querySelectorAll("h3, h4, .course-title, span, a, p, div"),
      function (el) {
        if (!isVolunteerZone(el)) return;
        var t = lower(el.textContent);
        if (t !== "lansing community college") return;
        if ((el.textContent || "").length > 40) return;
        el.style.setProperty("display", "none", "important");
      }
    );
  }

  function paintSchoolTitleWhite(el) {
    setImp(el, "color", "#ffffff");
    setImp(el, "-webkit-text-fill-color", "#ffffff");
    // Inline style attribute beats most stylesheets
    el.style.color = "#ffffff";
    el.style.setProperty("color", "#ffffff", "important");
    Array.prototype.forEach.call(el.querySelectorAll("*"), function (c) {
      if ((c.textContent || "").length > 60) return;
      setImp(c, "color", "#ffffff");
      setImp(c, "-webkit-text-fill-color", "#ffffff");
    });
  }

  function forceWhiteInCoursesOnly(root) {
    var areas = coursesContainers(root);
    areas.forEach(function (area) {
      if (isVolunteerZone(area)) return;
      Array.prototype.forEach.call(
        area.querySelectorAll(".course-title, h3, h4, a, span, strong, b, p, div"),
        function (el) {
          if (isVolunteerZone(el)) return;
          var t = lower(el.textContent);
          var isSchool =
            t === "lansing community college" ||
            t === "mongodb university" ||
            t === "rackspace cloud university" ||
            t.indexOf("lansing community college") !== -1 ||
            t.indexOf("mongodb university") !== -1 ||
            t.indexOf("rackspace cloud university") !== -1;
          if (!isSchool) return;
          if ((el.textContent || "").length > 60) return;
          paintSchoolTitleWhite(el);
          // Ensure course-title classes present for CSS
          if (el.classList) {
            if (t.indexOf("lansing") !== -1) el.classList.add("course-title", "lcc");
            if (t.indexOf("mongodb") !== -1) el.classList.add("course-title", "mongodb");
            if (t.indexOf("rackspace") !== -1 || t.indexOf("cloud university") !== -1) {
              el.classList.add("course-title", "rackspace");
            }
          }
        }
      );
    });
  }

  function findLccCourseCard(area) {
    var nodes = area.querySelectorAll(".course-group, .job-layout, article, .card, div");
    var best = null;
    Array.prototype.forEach.call(nodes, function (el) {
      if (isVolunteerZone(el)) return;
      var t = lower(el.textContent);
      if (t.indexOf("lansing community college") === -1) return;
      // Prefer block that also has course list items
      var score = (el.querySelector("ul, li") ? 2 : 0) + (el.querySelector(".course-title") ? 2 : 0);
      if (!best || score >= 2) best = el;
    });
    return best;
  }

  function mongoLogoInCourses(root) {
    return root.querySelector(
      '.course-grid img[alt*="MongoDB" i], .courses-card img[alt*="MongoDB" i], .course-grid img[src*="mongo1" i], .courses-card img[src*="mongo1" i]'
    );
  }

  function placeLccInCourses(root) {
    if (window.__bpCoursesStructureLocked) return;
    var areas = coursesContainers(root);
    if (!areas.length) return;

    var refImg = mongoLogoInCourses(root);
    var px = 50;
    if (refImg) {
      var w = parseInt(window.getComputedStyle(refImg).width, 10);
      if (w && w > 0 && w < 120) px = w;
    }
    var size = px + "px";

    areas.forEach(function (area) {
      if (isVolunteerZone(area)) return;
      var card = findLccCourseCard(area);
      if (!card) return;

      // Existing LCC image inside courses card?
      var img = null;
      Array.prototype.forEach.call(card.querySelectorAll("img"), function (im) {
        if (isLccImg(im)) img = im;
      });

      // Or elsewhere in courses area (but not volunteer)
      if (!img) {
        Array.prototype.forEach.call(area.querySelectorAll("img"), function (im) {
          if (!isLccImg(im)) return;
          if (isVolunteerZone(im)) return;
          img = im;
        });
      }

      // Or orphan LCC img outside volunteer that we can reclaim into courses
      if (!img) {
        Array.prototype.forEach.call(root.querySelectorAll("img"), function (im) {
          if (!isLccImg(im)) return;
          if (isVolunteerZone(im)) return;
          img = im;
        });
      }

      var wrap;
      if (!img) {
        wrap = document.createElement("div");
        wrap.className = "job-logo";
        img = document.createElement("img");
        img.alt = "Lansing Community College";
        img.src = refImg && refImg.getAttribute("src")
          ? (refImg.getAttribute("src") || "").replace(/[^\/]+$/, "lcclogo.jpg")
          : "lcclogo.jpg";
        img.className = "logo-img";
        wrap.appendChild(img);
      } else {
        wrap = img.closest(".job-logo, .course-logo") || img;
      }

      // Put logo at top of the same card Mongo/Rackspace use
      if (wrap.parentNode !== card || card.firstElementChild !== wrap) {
        card.insertBefore(wrap, card.firstChild);
      }

      ["width", "height", "min-width", "min-height", "max-width", "max-height"].forEach(function (p) {
        setImp(img, p, size);
      });
      setImp(img, "object-fit", "contain");
      setImp(img, "display", "block");
      setImp(img, "visibility", "visible");
      setImp(img, "opacity", "1");
      setImp(img, "margin", "0 auto");
      setImp(img, "border-radius", "12px");
      if (wrap && wrap !== img) {
        ["width", "height", "min-width", "min-height", "max-width", "max-height"].forEach(function (p) {
          setImp(wrap, p, size);
        });
        setImp(wrap, "display", "flex");
        setImp(wrap, "justify-content", "center");
        setImp(wrap, "margin", "0 auto 0.55rem auto");
      }
    });
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    try {
      stripLccFromVolunteer(root);
      placeLccInCourses(root);
      forceWhiteInCoursesOnly(root);
    } catch (e) {}
  }

  function schedule() {
    run();
    [50, 150, 350, 700, 1200, 2000, 3500, 5500, 8000, 12000].forEach(function (ms) {
      setTimeout(run, ms);
    });
    // Keep fighting late color re-application from other scripts
    var n = 0;
    var iv = setInterval(function () {
      if (document.body.classList.contains("bp-is-scrolling")) return;
      run();
      n += 1;
      if (n > 15) clearInterval(iv);
    }, 800);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 18000);
  }
})();
</script>

<!-- =========================================================
     STRICT ONLY: restore missing Lansing Community College
     logo + title inside Courses (match MongoDB block).
     Do not change volunteer, colors, jobs, marquee, or anything else.
========================================================= -->
<script id="bp-strict-restore-lcc-courses-only">
(function () {
  "use strict";

  function lower(s) {
    return (s || "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  function setImp(el, prop, val) {
    if (el && el.style) el.style.setProperty(prop, val, "important");
  }

  function isVolunteer(el) {
    return !!(el && el.closest && el.closest(
      ".bp-fused-volunteer, .volunteer-card, .volunteer-grid, .volunteer-section"
    ));
  }

  function getCoursesRoot(root) {
    var grid = root.querySelector(".course-grid, .courses-card");
    if (grid && !isVolunteer(grid)) return grid;
    var heads = root.querySelectorAll("h2, h3");
    for (var i = 0; i < heads.length; i++) {
      var t = lower(heads[i].textContent);
      if (t === "courses" || t === "technical training") {
        var sec = heads[i].closest("section, .section, div") || heads[i].parentElement;
        if (sec && !isVolunteer(sec)) return sec;
      }
    }
    return null;
  }

  function hasVisibleLccTitle(area) {
    var nodes = area.querySelectorAll(".course-title, h3, h4, a, span, strong, p, div");
    for (var i = 0; i < nodes.length; i++) {
      var el = nodes[i];
      if (isVolunteer(el)) continue;
      var t = lower(el.textContent);
      if (t.indexOf("lansing community college") === -1) continue;
      if ((el.textContent || "").length > 60) continue;
      var st = window.getComputedStyle(el);
      if (st.display === "none" || st.visibility === "hidden" || st.opacity === "0") {
        setImp(el, "display", "block");
        setImp(el, "visibility", "visible");
        setImp(el, "opacity", "1");
      }
      return el;
    }
    return null;
  }

  function hasLccLogo(area) {
    var imgs = area.querySelectorAll("img");
    for (var i = 0; i < imgs.length; i++) {
      if (isVolunteer(imgs[i])) continue;
      var alt = lower(imgs[i].getAttribute("alt"));
      var src = lower(imgs[i].getAttribute("src"));
      if (
        alt.indexOf("lansing") !== -1 ||
        alt.indexOf("community college") !== -1 ||
        src.indexOf("lcclogo") !== -1
      ) {
        setImp(imgs[i], "display", "block");
        setImp(imgs[i], "visibility", "visible");
        setImp(imgs[i], "opacity", "1");
        return imgs[i];
      }
    }
    return null;
  }

  function findMongoGroup(area) {
    var groups = area.querySelectorAll(".course-group, .job-layout, article, div");
    for (var i = 0; i < groups.length; i++) {
      var g = groups[i];
      if (isVolunteer(g)) continue;
      var t = lower(g.textContent);
      if (t.indexOf("mongodb university") !== -1 && t.length < 1200) return g;
    }
    return null;
  }

  function findLccList(area) {
    // Prefer a ul that mentions known LCC course strings
    var lists = area.querySelectorAll("ul");
    for (var i = 0; i < lists.length; i++) {
      var u = lists[i];
      if (isVolunteer(u)) continue;
      var t = lower(u.textContent);
      if (
        t.indexOf("writ 121") !== -1 ||
        t.indexOf("composition i") !== -1 ||
        t.indexOf("econ 201") !== -1 ||
        t.indexOf("indoor tennis") !== -1 ||
        t.indexOf("tap & lyrical") !== -1 ||
        t.indexOf("tap and lyrical") !== -1
      ) {
        return u;
      }
    }
    return null;
  }

  function sizeLike(img, ref) {
    var px = 50;
    if (ref) {
      var w = parseInt(window.getComputedStyle(ref).width, 10);
      if (w && w > 0 && w < 120) px = w;
    }
    var size = px + "px";
    ["width", "height", "min-width", "min-height", "max-width", "max-height"].forEach(function (p) {
      setImp(img, p, size);
    });
    setImp(img, "object-fit", "contain");
    setImp(img, "display", "block");
    setImp(img, "margin", "0 auto");
    setImp(img, "border-radius", "12px");
    setImp(img, "visibility", "visible");
    setImp(img, "opacity", "1");
    var wrap = img.closest(".job-logo, .course-logo");
    if (wrap) {
      ["width", "height", "min-width", "min-height", "max-width", "max-height"].forEach(function (p) {
        setImp(wrap, p, size);
      });
      setImp(wrap, "display", "flex");
      setImp(wrap, "justify-content", "center");
      setImp(wrap, "margin", "0 auto 0.55rem auto");
    }
  }

  function resolveLccSrc(root, refImg) {
    var imgs = root.querySelectorAll("img");
    for (var i = 0; i < imgs.length; i++) {
      var src = imgs[i].getAttribute("src") || "";
      if (/lcclogo/i.test(src)) return src;
    }
    if (refImg) {
      var s = refImg.getAttribute("src") || "";
      if (s.indexOf("/") !== -1) return s.replace(/[^\/]+$/, "lcclogo.jpg");
    }
    return "lcclogo.jpg";
  }

  function restore(root) {
    if (window.__bpCoursesStructureLocked) return;
    var area = getCoursesRoot(root);
    if (!area) return;
    if (area.getAttribute && area.getAttribute("data-bp-courses-locked") === "yes") return;

    var titleEl = hasVisibleLccTitle(area);
    var logoEl = hasLccLogo(area);
    var mongoGroup = findMongoGroup(area);
    var refImg = area.querySelector('img[alt*="MongoDB" i], img[src*="mongo1" i]');
    var lccList = findLccList(area);

    // Already complete
    if (titleEl && logoEl) {
      sizeLike(logoEl, refImg);
      // Ensure logo sits above title inside same parent when possible
      var card = titleEl.closest(".course-group, .job-layout, article, .card") || titleEl.parentElement;
      if (card && logoEl) {
        var wrap = logoEl.closest(".job-logo, .course-logo") || logoEl;
        if (!card.contains(logoEl)) {
          card.insertBefore(wrap, card.firstChild);
        }
      }
      return;
    }

    // Build a course-group matching Mongo structure
    var group = document.createElement("div");
    group.className = "course-group";
    group.setAttribute("data-bp-lcc-restored", "yes");

    // Logo
    var logoWrap = document.createElement("div");
    logoWrap.className = "job-logo";
    var img = document.createElement("img");
    img.alt = "Lansing Community College";
    img.className = "logo-img";
    img.src = resolveLccSrc(root, refImg);
    logoWrap.appendChild(img);
    group.appendChild(logoWrap);
    sizeLike(img, refImg);

    // Title (white — matches current school titles)
    var title = document.createElement("div");
    title.className = "course-title lcc";
    title.textContent = "Lansing Community College";
    setImp(title, "color", "#ffffff");
    setImp(title, "-webkit-text-fill-color", "#ffffff");
    setImp(title, "text-align", "center");
    setImp(title, "font-weight", "700");
    setImp(title, "margin", "0 0 0.45rem 0");
    group.appendChild(title);

    // Re-home existing LCC course list if found outside
    if (lccList && !group.contains(lccList)) {
      group.appendChild(lccList);
    }

    // Insert before MongoDB group if present, else at top of courses area
    if (mongoGroup && mongoGroup.parentNode) {
      mongoGroup.parentNode.insertBefore(group, mongoGroup);
    } else {
      // After Courses heading if possible
      var heading = null;
      Array.prototype.forEach.call(area.querySelectorAll("h2, h3"), function (h) {
        var t = lower(h.textContent);
        if (t === "courses" || t === "technical training") heading = h;
      });
      if (heading && heading.parentNode === area) {
        if (heading.nextSibling) area.insertBefore(group, heading.nextSibling);
        else area.appendChild(group);
      } else {
        area.insertBefore(group, area.firstChild);
      }
    }
  }

  function run() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    try {
      restore(root);
    } catch (e) {}
  }

  function schedule() {
    run();
    [100, 300, 700, 1200, 2000, 3500, 5500, 8000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 16000);
  }
})();
</script>

<!-- =========================================================
     STRICT: move existing LCC logo+title+list INTO the empty
     card beneath them (do not recreate content; only relocate).
========================================================= -->
<script id="bp-strict-move-lcc-into-empty-card">
(function () {
  "use strict";

  function lower(s) {
    return (s || "").replace(/\s+/g, " ").trim().toLowerCase();
  }

  function isVolunteer(el) {
    return !!(el && el.closest && el.closest(
      ".bp-fused-volunteer, .volunteer-card, .volunteer-grid, .volunteer-section"
    ));
  }

  function coursesRoot(root) {
    var grid = root.querySelector(".course-grid, .courses-card");
    if (grid && !isVolunteer(grid)) return grid;
    var heads = root.querySelectorAll("h2, h3");
    for (var i = 0; i < heads.length; i++) {
      var t = lower(heads[i].textContent);
      if (t === "courses" || t === "technical training") {
        var sec = heads[i].closest("section, .section, div") || heads[i].parentElement;
        if (sec && !isVolunteer(sec)) return sec;
      }
    }
    return null;
  }

  function isLccImg(img) {
    var alt = lower(img.getAttribute("alt"));
    var src = lower(img.getAttribute("src"));
    return (
      alt.indexOf("lansing") !== -1 ||
      alt.indexOf("community college") !== -1 ||
      src.indexOf("lcclogo") !== -1
    );
  }

  function isLccTitle(el) {
    var t = lower(el.textContent);
    return t.indexOf("lansing community college") !== -1 && (el.textContent || "").length < 60;
  }

  function isLccList(ul) {
    var t = lower(ul.textContent);
    return (
      t.indexOf("writ 121") !== -1 ||
      t.indexOf("composition i") !== -1 ||
      t.indexOf("econ 201") !== -1 ||
      t.indexOf("indoor tennis") !== -1 ||
      t.indexOf("tap") !== -1
    );
  }

  function isEmptyCard(el) {
    if (!el || el.nodeType !== 1) return false;
    if (isVolunteer(el)) return false;
    // Has card-like chrome (padding/radius/background) but little/no meaningful text
    var text = lower(el.textContent).replace(/\s+/g, " ").trim();
    // Empty or nearly empty of text content
    if (text.length > 8) return false;
    var style = window.getComputedStyle(el);
    var radius = parseFloat(style.borderRadius) || 0;
    var padT = parseFloat(style.paddingTop) || 0;
    var padB = parseFloat(style.paddingBottom) || 0;
    var minH = parseFloat(style.minHeight) || el.offsetHeight || 0;
    // Looks like a reserved card shell
    if (radius >= 8 || padT + padB >= 16 || minH >= 80) return true;
    // Class hints
    var cls = (el.className && String(el.className)) || "";
    if (/course-group|job-layout|card|cert/i.test(cls)) return true;
    return false;
  }

  function collectLccPieces(area) {
    var logo = null;
    var title = null;
    var list = null;

    Array.prototype.forEach.call(area.querySelectorAll("img"), function (img) {
      if (isVolunteer(img)) return;
      if (isLccImg(img)) logo = img.closest(".job-logo, .course-logo") || img;
    });

    Array.prototype.forEach.call(
      area.querySelectorAll(".course-title, h3, h4, a, span, strong, p, div"),
      function (el) {
        if (isVolunteer(el)) return;
        if (!isLccTitle(el)) return;
        // Prefer the tightest title node
        if (!title || el.textContent.length <= title.textContent.length) title = el;
      }
    );

    Array.prototype.forEach.call(area.querySelectorAll("ul"), function (ul) {
      if (isVolunteer(ul)) return;
      if (isLccList(ul)) list = ul;
    });

    return { logo: logo, title: title, list: list };
  }

  function findEmptyCardBelow(area, pieces) {
    // 1) Explicit empty course-group / card with no LCC text
    var candidates = area.querySelectorAll(
      ".course-group, .job-layout, article, .card, div"
    );
    var empties = [];
    Array.prototype.forEach.call(candidates, function (el) {
      if (!isEmptyCard(el)) return;
      // Must not already contain mongo/rackspace content
      var t = lower(el.textContent);
      if (t.indexOf("mongodb") !== -1 || t.indexOf("rackspace") !== -1) return;
      empties.push(el);
    });

    if (!empties.length) return null;

    // Prefer the empty card that follows the LCC title/list in document order
    var anchor = pieces.title || pieces.list || pieces.logo;
    if (anchor) {
      for (var i = 0; i < empties.length; i++) {
        var pos = anchor.compareDocumentPosition(empties[i]);
        if (pos & Node.DOCUMENT_POSITION_FOLLOWING) return empties[i];
      }
    }
    return empties[0];
  }

  function alreadyInside(card, pieces) {
    if (!card) return false;
    var ok = true;
    if (pieces.logo && !card.contains(pieces.logo)) ok = false;
    if (pieces.title && !card.contains(pieces.title)) ok = false;
    if (pieces.list && !card.contains(pieces.list)) ok = false;
    return ok && (pieces.logo || pieces.title || pieces.list);
  }

  function moveIn(card, pieces) {
    if (!card) return;
    // Order: logo, title, list
    if (pieces.logo && !card.contains(pieces.logo)) {
      card.appendChild(pieces.logo);
    }
    if (pieces.title && !card.contains(pieces.title)) {
      card.appendChild(pieces.title);
    }
    if (pieces.list && !card.contains(pieces.list)) {
      card.appendChild(pieces.list);
    }
    // Ensure visible
    card.style.setProperty("display", "", "important");
    card.style.removeProperty("display");
  }

  function run() {
    if (window.__bpCoursesStructureLocked) return;
    var root = document.getElementById("mobileContent");
    if (!root) return;
    var area = coursesRoot(root);
    if (!area) return;
    if (area.getAttribute("data-bp-courses-locked") === "yes") return;

    try {
      var pieces = collectLccPieces(area);
      if (!pieces.logo && !pieces.title && !pieces.list) return;

      var card = findEmptyCardBelow(area, pieces);
      if (!card) {
        // Fallback: parent next-sibling empty card after title
        var anchor = pieces.title || pieces.list || pieces.logo;
        if (anchor) {
          var sib = anchor.parentElement && anchor.parentElement.nextElementSibling;
          while (sib) {
            if (isEmptyCard(sib)) {
              card = sib;
              break;
            }
            sib = sib.nextElementSibling;
          }
        }
      }
      if (!card) return;
      if (alreadyInside(card, pieces)) return;
      moveIn(card, pieces);
    } catch (e) {}
  }

  function schedule() {
    run();
    [80, 200, 500, 1000, 1800, 3000, 5000, 8000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });

  var host = document.getElementById("mobileContent");
  if (host && window.MutationObserver) {
    var mo = new MutationObserver(function () { run(); });
    mo.observe(host, { childList: true, subtree: true });
    setTimeout(function () { try { mo.disconnect(); } catch (e) {} }, 16000);
  }
})();
</script>

<!-- =========================================================
     SCROLL STABILITY — stop blink in/out while scrolling

     Freezes repair loops during scroll; resumes after settle.
========================================================= -->
<style id="bp-scroll-stability-no-blink">
  html, body.bp-mobile-page {
    scroll-behavior: auto !important;

  }

  /* While user is scrolling, lock paint on heavy embeds */

    animation-play-state: paused !important;
  }
</style>

<script id="bp-scroll-stability-no-blink-script">
(function () {
  "use strict";

  var scrollTimer = null;
  var scrolling = false;
  var settled = false;

  function setScrolling(on) {
    scrolling = on;
    if (on) {
      document.body.classList.add("bp-is-scrolling");
      document.documentElement.classList.add("bp-is-scrolling");
    } else {
      document.body.classList.remove("bp-is-scrolling");
      document.documentElement.classList.remove("bp-is-scrolling");
    }
  }

  function onScroll() {
    if (!scrolling) setScrolling(true);
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      setScrolling(false);
    }, 180);
  }

  // Patch high-frequency repair runners: skip work while scrolling
  function wrapWindowInterval() {
    var native = window.setInterval;
    if (window.__bpScrollStableInterval) return;
    window.__bpScrollStableInterval = true;
    window.setInterval = function (fn, delay) {
      if (typeof fn !== "function") return native.apply(window, arguments);
      var wrapped = function () {
        if (scrolling) return;
        // After page has settled, slow continuous repair loops are the main blink source
        try {
          return fn.apply(this, arguments);
        } catch (e) {}
      };
      return native.call(window, wrapped, delay);
    };
  }

  // After initial load, disconnect late MutationObservers that keep rewiring the whole tree
  function quietLateObservers() {
    if (settled) return;
    settled = true;
    // Mark body so other scripts can opt out if they check this
    document.documentElement.classList.add("bp-scroll-stable-settled");
    document.body.classList.add("bp-scroll-stable-settled");
  }

  wrapWindowInterval();

  window.addEventListener("scroll", onScroll, { passive: true, capture: true });
  document.addEventListener("scroll", onScroll, { passive: true, capture: true });
  window.addEventListener("touchmove", onScroll, { passive: true, capture: true });

  // Touch on mobile content
  var shell = document.getElementById("mobileShell") || document.querySelector(".mobile-shell");
  if (shell) {
    shell.addEventListener("scroll", onScroll, { passive: true });
    shell.addEventListener("touchmove", onScroll, { passive: true });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () {
      setTimeout(quietLateObservers, 9000);
    });
  } else {
    setTimeout(quietLateObservers, 9000);
  }
  window.addEventListener("load", function () {
    setTimeout(quietLateObservers, 7000);
  }, { passive: true });
})();
</script>

<!-- =========================================================
     COURSES STABILITY LOCK — no hover swap / blink / reshuffle
     Course blocks stay in their own elements. One-shot lock.
========================================================= -->
<style id="bp-courses-hover-stability-lock">
  body.bp-mobile-page #mobileContent .course-grid,
  body.bp-mobile-page #mobileContent .courses-card,
  body.bp-mobile-page #mobileContent .course-group,
  body.bp-mobile-page #mobileContent .course-grid .job-layout,

  body.bp-mobile-page #mobileContent .course-group a,
  body.bp-mobile-page #mobileContent .course-grid a:hover,
  body.bp-mobile-page #mobileContent .courses-card a:hover,
  body.bp-mobile-page #mobileContent .course-group a:hover,

    transition: none !important;
  }

<script id="bp-courses-hover-stability-lock-script">
(function () {
  "use strict";

  var locked = false;

  function lockCoursesStructure() {
    if (locked) return;
    var root = document.getElementById("mobileContent");
    if (!root) return;

    var area = root.querySelector(".course-grid, .courses-card");
    if (!area) return;

    // Freeze: mark each course group so move/restore scripts can no-op
    var groups = area.querySelectorAll(".course-group, .job-layout");
    if (!groups.length) {
      // still lock the area itself
      area.setAttribute("data-bp-courses-locked", "yes");
      locked = true;
      return;
    }

    Array.prototype.forEach.call(groups, function (g) {
      g.setAttribute("data-bp-courses-locked", "yes");
      // Prevent accidental display toggles
      g.style.setProperty("transition", "none", "important");
      g.style.setProperty("animation", "none", "important");
      g.style.setProperty("transform", "none", "important");
    });

    area.setAttribute("data-bp-courses-locked", "yes");
    locked = true;

    // Soft-disable further aggressive LCC movers by setting a global flag
    window.__bpCoursesStructureLocked = true;
  }

  // Patch common restore entry points to respect the lock (best-effort)
  function guardGlobalRuns() {
    // If later scripts check this flag, they can skip. We also wrap
    // MutationObserver callbacks that only touch courses after lock by
    // setting a capture-phase mouseenter that doesn't reshuffle.
  }

  // Stop pointer hover from causing layout thrash on courses
  function stabilizePointer() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    var area = root.querySelector(".course-grid, .courses-card");
    if (!area || area.getAttribute("data-bp-courses-pointer") === "yes") return;
    area.setAttribute("data-bp-courses-pointer", "yes");

    ["mouseenter", "mouseover", "mouseleave", "mouseout"].forEach(function (evt) {
      area.addEventListener(
        evt,
        function (e) {
          // Do not allow hover handlers higher up to mutate courses layout
          if (window.__bpCoursesStructureLocked) {
            // keep default color hover only; block nothing critical
          }
        },
        true
      );
    });
  }

  function run() {
    try {
      stabilizePointer();
      // Lock after content has had time to settle
      if (!locked) lockCoursesStructure();
    } catch (e) {}
  }

  // Lock once after load + a few delayed attempts, then stop
  function schedule() {
    [1500, 3000, 5000, 8000, 11000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });
})();
</script>

<script id="bp-courses-lock-guard-existing-movers">
(function () {
  "use strict";
  // Monkey-patch: if restore/move scripts run after lock, skip DOM moves
  // by short-circuiting when the locked flag is set.

  function shouldSkip() {
    return !!window.__bpCoursesStructureLocked;
  }

  // Wrap appendChild/insertBefore only on course-grid after lock — too invasive.
  // Instead, observe and revert unauthorized moves is heavy.
  // Simplest reliable approach: after lock, disconnect is not available for others.
  // Re-assert children order is stable by not running more movers.

  // Override setTimeout callbacks is too broad.
  // Provide a documented flag; update our own movers if they re-run via MO.

  var nativeMO = window.MutationObserver;
  if (!nativeMO || window.__bpCoursesMOWrapped) return;
  window.__bpCoursesMOWrapped = true;

  window.MutationObserver = function (callback) {
    var wrapped = function (records, obs) {
      if (shouldSkip()) {
        // Ignore mutations after courses structure is locked (stops hover/blink reshuffles)
        // Still allow non-courses pages? Records may be mixed — only skip if ALL
        // targets are inside locked courses area.
        var onlyCourses = records.every(function (r) {
          var t = r.target;
          if (!t || !t.closest) return false;
          var area = t.closest(".course-grid, .courses-card");
          return !!(area && area.getAttribute("data-bp-courses-locked") === "yes");
        });
        if (onlyCourses && records.length) return;
      }
      return callback.apply(this, arguments);
    };
    return new nativeMO(wrapped);
  };
  window.MutationObserver.prototype = nativeMO.prototype;
})();
</script>

<script id="bp-global-no-blink-motion-script">
(function () {
  "use strict";

  var scrollTimer = null;
  var moveTimer = null;

  function setFlag(name, on) {
    document.body.classList.toggle(name, !!on);
    document.documentElement.classList.toggle(name, !!on);
  }

  function onScrollActivity() {
    setFlag("bp-is-scrolling", true);
    setFlag("bp-is-moving", true);
    if (scrollTimer) clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function () {
      setFlag("bp-is-scrolling", false);
      setFlag("bp-is-moving", false);
    }, 200);
  }

  function onMoveActivity() {
    setFlag("bp-is-moving", true);
    if (moveTimer) clearTimeout(moveTimer);
    moveTimer = setTimeout(function () {
      setFlag("bp-is-moving", false);
    }, 200);
  }

  // Page scroll
  window.addEventListener("scroll", onScrollActivity, { passive: true, capture: true });
  document.addEventListener("scroll", onScrollActivity, { passive: true, capture: true });
  window.addEventListener("touchmove", onScrollActivity, { passive: true, capture: true });
  window.addEventListener("wheel", onScrollActivity, { passive: true, capture: true });

  // Marquee touch / pan
  function bindMarquee() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    var vp = root.querySelector(".enterprise-brand-slider__viewport, .enterprise-brand-slider");
    if (!vp || vp.getAttribute("data-bp-noblink-bound") === "yes") return;
    vp.setAttribute("data-bp-noblink-bound", "yes");

    function touchOn() {
      document.body.classList.add("bp-marquee-touching");
      onMoveActivity();
    }
    function touchOff() {
      document.body.classList.remove("bp-marquee-touching");
      onMoveActivity();
    }
    ["touchstart", "pointerdown"].forEach(function (e) {
      vp.addEventListener(e, touchOn, { passive: true });
    });
    ["touchend", "touchcancel", "pointerup", "pointercancel"].forEach(function (e) {
      vp.addEventListener(e, touchOff, { passive: true });
    });
    vp.addEventListener("scroll", onMoveActivity, { passive: true });
  }

  // +/- and matrix toggles: mark brief move, force no opacity animation
  function bindToggles() {
    var root = document.getElementById("mobileContent");
    if (!root) return;
    if (root.getAttribute("data-bp-toggle-noblink") === "yes") return;
    root.setAttribute("data-bp-toggle-noblink", "yes");

    root.addEventListener(
      "click",
      function (e) {
        var t = e.target && e.target.closest && e.target.closest(
          ".job-click, .job-toggle-row, .card-toggle, .matrix-card .card-toggle"
        );
        if (!t) return;
        onMoveActivity();
        // Ensure expanded panels don't fade
        setTimeout(function () {
          var card = t.closest(".matrix-card, .job-details, .timeline-item");
          if (!card) return;
          Array.prototype.forEach.call(
            card.querySelectorAll(".job-list-collapsible, .card-content"),
            function (el) {
              el.style.setProperty("transition", "none", "important");
              el.style.setProperty("animation", "none", "important");
              el.style.setProperty("opacity", "1", "important");
            }
          );
        }, 0);
      },
      true
    );
  }

  // Skip repair work while moving (extend existing interval guard)
  var nativeSetInterval = window.setInterval;
  if (!window.__bpGlobalNoBlinkInterval) {
    window.__bpGlobalNoBlinkInterval = true;
    window.setInterval = function (fn, delay) {
      if (typeof fn !== "function") return nativeSetInterval.apply(window, arguments);
      return nativeSetInterval.call(window, function () {
        if (
          document.body.classList.contains("bp-is-scrolling") ||
          document.body.classList.contains("bp-is-moving") ||
          document.body.classList.contains("bp-marquee-touching")
        ) {
          return;
        }
        try {
          return fn.apply(this, arguments);
        } catch (e) {}
      }, delay);
    };
  }

  function run() {
    bindMarquee();
    bindToggles();
  }

  function schedule() {
    run();
    [200, 800, 2000, 4000, 7000].forEach(function (ms) {
      setTimeout(run, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });
})();
</script>

<script id="bp-unlock-page-scroll-script">
(function () {
  "use strict";

  function unlock() {
    var html = document.documentElement;
    var body = document.body;
    [html, body].forEach(function (el) {
      if (!el || !el.style) return;
      el.style.setProperty("overflow-x", "hidden", "important");
      el.style.setProperty("overflow-y", "auto", "important");
      el.style.setProperty("height", "auto", "important");
      el.style.setProperty("max-height", "none", "important");
      el.style.setProperty("position", "static", "important");
      el.style.setProperty("touch-action", "pan-y pinch-zoom", "important");
      el.style.setProperty("pointer-events", "auto", "important");
    });

    ["mobileShell", "mobileContent"].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el) return;
      el.style.setProperty("overflow-x", "hidden", "important");
      el.style.setProperty("overflow-y", "visible", "important");
      el.style.setProperty("max-height", "none", "important");
      el.style.setProperty("height", "auto", "important");
      el.style.setProperty("touch-action", "pan-y pinch-zoom", "important");
      el.style.setProperty("pointer-events", "auto", "important");
    });

    var shell = document.querySelector("#mobileContent .resume-shell, .mobile-shell");
    if (shell) {
      shell.style.setProperty("overflow", "visible", "important");
      shell.style.setProperty("overflow-x", "hidden", "important");
      shell.style.setProperty("overflow-y", "visible", "important");
      shell.style.setProperty("max-height", "none", "important");
      shell.style.setProperty("pointer-events", "auto", "important");
    }

    // Clear any accidental scroll lock classes that freeze the page
    document.body.classList.remove("bp-is-scrolling", "bp-is-moving");
    html.classList.remove("bp-is-scrolling", "bp-is-moving");
  }

  // Soften scroll flag: only used for marquee pause, never locks body
  var timer = null;
  function onScroll() {
    document.body.classList.add("bp-is-scrolling");
    if (timer) clearTimeout(timer);
    timer = setTimeout(function () {
      document.body.classList.remove("bp-is-scrolling");
      document.documentElement.classList.remove("bp-is-scrolling");
    }, 150);
    // Always ensure scroll stays unlocked
    document.body.style.setProperty("overflow-y", "auto", "important");
    document.documentElement.style.setProperty("overflow-y", "auto", "important");
  }

  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("touchstart", function () {
    unlock();
  }, { passive: true });

  function schedule() {
    unlock();
    [50, 200, 500, 1000, 2000, 4000].forEach(function (ms) {
      setTimeout(unlock, ms);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", schedule);
  } else {
    schedule();
  }
  window.addEventListener("load", schedule, { passive: true });
})();
</script>

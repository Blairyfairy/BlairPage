<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blair Page | Gallery</title>
<link rel="stylesheet" href="style.css">
<style>

/* ===== GLOBAL RESET (ADDED SAFE FIX) ===== */
html, body {
  margin:0;
  padding:0;
  height:100%;
}

/* GALLERY PAGE: force html/body transparent so this page's own
   video can act as the true background. If both html and body get
   a background from the shared style.css (used on other pages),
   body's background stops acting as the page canvas and paints as
   a normal box ABOVE a z-index:-1 element like .hero, hiding the
   video behind an opaque layer. Neutralize that here. */
html,
body#gallery-page{
  background:transparent !important;
  background-color:transparent !important;
  background-image:none !important;
}

/* ===== MATCH BLOG GLASS VARIABLES ===== */

:root{
  --glass-bg: rgba(58,62,59,0.15);
  --glass-border: rgba(240,239,244,0.22);
  --black: #000000ff;
  --midnight-violet: #291528ff;
  --charcoal-brown: #3a3e3bff;
  --ghost-white: #f0eff4ff;
  --dusty-mauve: #9e829cff;
  --text-light: var(--ghost-white);
  --bg-light: linear-gradient(
    135deg,
    #000000ff 0%,
    #291528ff 30%,
    #3a3e3bff 60%,
    #9e829cff 85%,
    #f0eff4ff 100%
  );
}

body.dark{
  --glass-bg: rgba(8,10,14,0.42);
  --glass-border: rgba(240,239,244,0.14);
  --text-light: var(--ghost-white);
  --bg-light: linear-gradient(
    135deg,
    #050507 0%,
    #0d0f16 25%,
    #141824 55%,
    #1c1f2b 78%,
    #26212d 100%
  );
}

/* ===== Top Bar ===== */

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 2rem;
  font-size:.85rem;
  position:absolute;
  top:0;
  width:100%;
  z-index:100;
  box-sizing:border-box;
}

/* ===== Menu Links (same as blog) ===== */

.site-nav a{
  margin:0 1rem;
  color:#9e829c;
  text-decoration:none;
  font-weight:600;
}

.site-nav a:hover{
  text-decoration:underline;
  color:#f0eff4;
}

/* ===== THEME TOGGLE (EXACT INDEX MATCH VALUES) ===== */

.theme-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid var(--glass-border);
  border-radius:20px;
  padding:.4rem 1rem;
  min-width:44px;
  min-height:34px;
  font-size:.85rem;
  font-weight:400;
  line-height:1;
  letter-spacing:0;
  box-sizing:border-box;
  box-shadow:none;
  margin:0;
  color:var(--text-light);
  cursor:pointer;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  outline:none;
}

/* ===== Hero Video ===== */

.hero{
  position:fixed !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100vw !important;
  height:100vh !important;
  height:100dvh !important;
  overflow:hidden !important;
  z-index:-1 !important;
  margin:0 !important;
  padding:0 !important;
  background:none !important;
  background-color:transparent !important;
  background-image:none !important;
  border:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
}

.hero video{
  position:absolute !important;
  top:0 !important;
  left:0 !important;
  right:0 !important;
  bottom:0 !important;
  width:100% !important;
  height:100% !important;
  min-width:100% !important;
  min-height:100% !important;
  object-fit:cover !important;
  object-position:center !important;
  filter:brightness(.6);
  cursor:pointer;
  display:block;
  background:transparent;
}

/* Page-scoped, higher-specificity guard: overrides any .hero rule
   from the shared style.css (e.g. an index-page "hero" banner) that
   could otherwise paint an opaque box over this page's video. */
body#gallery-page .hero{
  position:fixed !important;
  inset:0 !important;
  width:100vw !important;
  height:100vh !important;
  height:100dvh !important;
  overflow:hidden !important;
  z-index:-1 !important;
  margin:0 !important;
  padding:0 !important;
  background:none !important;
  background-color:transparent !important;
  background-image:none !important;
  border:none !important;
  border-radius:0 !important;
  box-shadow:none !important;
}

body#gallery-page .hero video{
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  min-width:100% !important;
  min-height:100% !important;
  object-fit:cover !important;
  object-position:center !important;
  display:block;
  background:transparent !important;
  z-index:-1 !important;
}

body.dark .hero video{
  filter:brightness(.32);
}

/* ===== Logo ===== */

.logo-top-left{
  position:absolute;
  top:100px;
  left:16px;
  z-index:1000;
  width:60px;
  height:60px;
  border-radius:50%;
  overflow:hidden;
  cursor:pointer;
  border:3px solid rgba(240,239,244,.45);
  box-shadow:0 8px 20px rgba(0,0,0,.7);
  transition:transform .3s ease, box-shadow .3s ease;
}

.logo-top-left img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo-top-left:hover{
  transform:scale(1.05);
  box-shadow:0 12px 28px rgba(0,0,0,.8);
}

/* ===== Gallery Wrapper ===== */

.gallery-wrapper{
  position:relative;
  top:calc(100vh - 230px);
  width:100%;
  max-width:1600px;
  padding:1rem;
  margin:0 auto;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

/* ===== Refresh Button ===== */

.refresh-photos-btn{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:999px;
  padding:.7rem 1.15rem;
  cursor:pointer;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text-light);
  font-weight:600;
  letter-spacing:.01em;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
  margin-bottom:1rem;
}

.refresh-photos-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 28px rgba(0,0,0,.24);
  border-color:rgba(240,239,244,0.32);
  background:rgba(240,239,244,0.10);
}

/* ===== Carousel ===== */

.gallery-carousel{
  display:flex;
  gap:12px;
  transition:transform .3s ease;
  cursor:grab;
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  scrollbar-width:none;
  -ms-overflow-style:none;
}

.gallery-carousel::-webkit-scrollbar{
  display:none;
}

.gallery-carousel.dragging{
  cursor:grabbing;
}

.gallery-carousel img{
  width:200px;
  height:200px;
  flex-shrink:0;
  border-radius:14px;
  object-fit:cover;
  background:rgba(240,239,244,0.08);
  border:1px solid rgba(240,239,244,0.18);
  box-shadow:none;
  transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease, opacity .3s ease;
  display:none;
}

.gallery-carousel img[data-loading="true"]{
  opacity:1;
}

.gallery-carousel img[data-loaded="true"]{
  display:block;
}

.gallery-carousel img:hover{
  transform:scale(1.05);
  box-shadow:none;
  border-color:rgba(240,239,244,0.28);
  background:rgba(240,239,244,0.12);
}

/* ===== Arrows ===== */

.arrow{
  position:absolute;
  top:calc(50% + 22px);
  transform:translateY(-50%);
  background:#9e829c;
  border:none;
  padding:.5rem 1rem;
  cursor:pointer;
  border-radius:50%;
  z-index:1000;
}

.arrow-left{ left:10px; }
.arrow-right{ right:10px; }

.arrow:hover{
  background:#9e829c;
}

/* ===== Lightbox ===== */

.lightbox{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:14px;
}

.lightbox.show{
  display:flex;
}

/* ===== PAGE SCROLL TOP TRIANGLE ===== */

.page-scroll-top{
  position:fixed;
  right:18px;
  bottom:18px;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  margin:0;
  background:transparent;
  border:none;
  outline:none;
  box-shadow:none;
  color:#ffffff;
  font-size:18px;
  line-height:1;
  cursor:pointer;
  z-index:10050;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  appearance:none;
  -webkit-appearance:none;
}

.page-scroll-top.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.page-scroll-top span{
  display:block;
  line-height:1;
  transform:translateY(-1px);
}

/* ===== Mobile ===== */

@media(max-width:900px){

html,
body{
  min-height:100vh;
  min-height:100dvh;
  height:auto !important;
  background:var(--bg-light) !important;
  background-image:var(--bg-light) !important;
  background-repeat:no-repeat !important;
  background-size:cover !important;
  background-attachment:scroll !important;
  overflow-x:hidden !important;
  overflow-y:auto !important;
  -webkit-overflow-scrolling:touch;
}

/* FIX: prevent white rectangle / bounce flash at bottom */
html::before{
  content:"";
  position:fixed;
  inset:0;
  background:var(--bg-light) !important;
  background-image:var(--bg-light) !important;
  z-index:-4;
  pointer-events:none;
}

body::before{
  content:"";
  position:fixed;
  inset:-2px 0 -2px 0;
  background:var(--bg-light) !important;
  background-image:var(--bg-light) !important;
  z-index:-3;
  pointer-events:none;
}

.top-bar{
  display:grid !important;
  grid-template-columns:minmax(0,1fr) auto !important;
  grid-template-areas:
    "cred toggle"
    "nav  toggle" !important;
  align-items:start !important;
  row-gap:2px !important;
  position:absolute !important;
  top:0 !important;
  left:0 !important;
  width:100% !important;
  min-height:52px !important;
  padding:10px 16px 0 16px !important;
  box-sizing:border-box !important;
}

.credential-header{
  grid-area:cred !important;
  display:block !important;
  position:relative !important;
  top:auto !important;
  left:auto !important;
  right:auto !important;
  transform:none !important;
  margin:0 !important;
  padding:0 !important;
  width:auto !important;
  max-width:calc(100% - 92px) !important;
  font-size:0.425rem;
  line-height:1.05 !important;
  text-align:left !important;
  justify-self:start !important;
  align-self:start !important;
}

.credential-header,
.credential-header *{
  text-align:left !important;
}

.site-nav{
  grid-area:nav !important;
  display:flex !important;
  position:relative !important;
  top:auto !important;
  left:auto !important;
  right:auto !important;
  transform:none !important;
  justify-content:flex-start !important;
  justify-self:start !important;
  align-items:center !important;
  flex-wrap:nowrap !important;
  margin:2px 0 0 0 !important;
  padding:0 !important;
  width:auto !important;
}

.site-nav a{
  margin:0 1rem 0 0 !important;
  text-align:left !important;
}

.gallery-carousel{
  flex-wrap:nowrap;
  justify-content:flex-start;
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding:0 14vw 4px;
  scroll-padding-left:14vw;
}

.gallery-carousel img{
  width:72vw;
  height:auto;
  aspect-ratio:1 / 1;
  flex-shrink:0;
  scroll-snap-align:center;
  scroll-snap-stop:always;
  display:none;
}

.gallery-carousel img[data-loaded="true"]{
  display:block;
}

.hero{
  height:100vh;
  height:100dvh;
  min-height:100dvh;
  background:transparent !important;
  background-image:none !important;
}

/* FIX: make video fill snugly past mobile bottom edges */
.hero video{
  position:absolute !important;
  inset:0 !important;
  width:100% !important;
  height:100% !important;
  min-height:100% !important;
  object-fit:cover !important;
  object-position:center center !important;
  display:block;
  background:transparent;
  transform:translateZ(0);
}

.logo-top-left{
  top:80px;
  width:50px;
  height:50px;
}

.arrow{
  display:none;
}

.refresh-photos-btn{
  width:100%;
  max-width:280px;
  padding:.78rem 1rem;
  margin-bottom:1rem;
}

.page-scroll-top{
  right:14px;
  bottom:14px;
  width:26px;
  height:26px;
  font-size:17px;
  z-index:10060;
}

/* FIX: add a little snug bottom space so scroll never exposes blank area */
.gallery-wrapper{
  top:calc(100dvh - 190px);
  padding-bottom:24px;
}

.theme-btn{
  grid-area:toggle !important;
  position:relative !important;
  top:auto !important;
  right:auto !important;
  justify-self:end !important;
  align-self:start !important;
  padding:.4rem 1rem;
  min-width:44px;
  min-height:34px;
  font-size:.85rem;
  line-height:1;
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  color:var(--text-light);
  box-shadow:none;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  margin:0 !important;
}

}

/* ===== Mobile Landscape Only ===== */

@media(max-width:900px) and (orientation:landscape){

.gallery-wrapper{
  top:calc(100dvh - 90px);
}

}

"Jpg","Jpeg","Png","Webp","Gif","Avif","Bmp","Svg","Tif","Tiff","Jfif","Pjpeg","Pjp","Apng","Heic","Heif","Ico","Jpe","Dib","Cur","Dds","Exr","Hdr","Iff","Jp2","J2k","Jpf","Jpx","Jpm","Mj2","Jxr","Wdp","Hdp","Pcx","Pic","Pct","Pict","Pnm","Pbm","Pgm","Ppm","Pfm","Psd","Psb","Qoi","Ras","Sgi","Rgb","Rgba","Bw","Int","Inta","Tga","Icb","Vda","Vst","Wbmp","Webm"

const resolvedImageCache=new Map();
const failedImageCache=new Set();
const pendingResolutionCache=new Map();

function buildImageCandidates(path){
const candidateSet=new Set();

const slashIndex=path.lastIndexOf("/");
const directory=slashIndex>-1?path.slice(0,slashIndex+1):"";
const filePart=slashIndex>-1?path.slice(slashIndex+1):path;

let numberValue=null;
const numberMatch=filePart.match(/(\d+)/);
if(numberMatch){
numberValue=parseInt(numberMatch[1],10);
}

let exactBaseName=filePart;
if(filePart.includes(".")){
exactBaseName=filePart.replace(/\.[^.]+$/,"");
}
if(exactBaseName.endsWith("*")){
exactBaseName=exactBaseName.slice(0,-1);
}
if(exactBaseName.endsWith(".")){
exactBaseName=exactBaseName.slice(0,-1);
}

const baseNames=new Set();
baseNames.add(exactBaseName);

if(numberValue!==null){
baseNames.add(`img${numberValue}`);
baseNames.add(`IMG${numberValue}`);
baseNames.add(`Img${numberValue}`);
}

["png","jpg","jpeg","PNG","JPG","JPEG"].forEach(ext=>{
baseNames.forEach(baseVariant=>{
const direct=`${directory}${baseVariant}.${ext}`;
candidateSet.add(direct);
candidateSet.add(encodeURI(direct));
candidateSet.add(direct.replace(/ /g,"%20"));
candidateSet.add(decodeURI(encodeURI(direct)));
});
});

imageExtensions.forEach(ext=>{
baseNames.forEach(baseVariant=>{
const direct=`${directory}${baseVariant}.${ext}`;
candidateSet.add(direct);
candidateSet.add(encodeURI(direct));
candidateSet.add(direct.replace(/ /g,"%20"));
candidateSet.add(decodeURI(encodeURI(direct)));
});
});

return [...candidateSet];
}

function getResolvedImagePath(path){
if(resolvedImageCache.has(path)) return resolvedImageCache.get(path);
return null;
}

function setResolvedImagePath(path,resolved){
resolvedImageCache.set(path,resolved);
failedImageCache.delete(path);
pendingResolutionCache.delete(path);
}

function markFailedImagePath(path){
failedImageCache.add(path);
pendingResolutionCache.delete(path);
}

function shuffleArray(array){
const arr=[...array];
for(let i=arr.length-1;i>0;i--){
const j=Math.floor(Math.random()*(i+1));
[arr[i],arr[j]]=[arr[j],arr[i]];
}
return arr;
}

function resolveImagePathAggressive(path,candidates){
if(resolvedImageCache.has(path)){
return Promise.resolve(resolvedImageCache.get(path));
}

if(pendingResolutionCache.has(path)){
return pendingResolutionCache.get(path);
}

const resolutionPromise=new Promise((resolve,reject)=>{
let attemptIndex=0;

function tryNext(){
if(attemptIndex>=candidates.length){
markFailedImagePath(path);
reject(new Error("Could not resolve image"));
return;
}

const candidate=candidates[attemptIndex++];
const probe=new Image();
probe.decoding="async";
probe.loading="eager";
probe.referrerPolicy="no-referrer";

probe.onload=()=>{
setResolvedImagePath(path,candidate);
resolve(candidate);
};

probe.onerror=()=>tryNext();
probe.src=candidate;
}

tryNext();
});

pendingResolutionCache.set(path,resolutionPromise);
return resolutionPromise;
}

function prewarmImageResolutions(slots){
const prewarmQueue=[...slots].sort((a,b)=>a.index-b.index);
let prewarmIndex=0;
let activePrewarms=0;
const maxConcurrentPrewarms=window.innerWidth<=900?40:28;

function pumpPrewarm(){
while(activePrewarms<maxConcurrentPrewarms&&prewarmIndex<prewarmQueue.length){
const item=prewarmQueue[prewarmIndex++];
if(resolvedImageCache.has(item.src)) continue;
activePrewarms++;
resolveImagePathAggressive(item.src,item.candidates)
.then(()=>{})
.catch(()=>{})
.finally(()=>{
activePrewarms--;
pumpPrewarm();
});
}
}

pumpPrewarm();
}

function initializeGallery(images){
const shuffled=shuffleArray(images);
const carousel=document.getElementById("galleryCarousel");
carousel.innerHTML="";
failedImageCache.clear();
pendingResolutionCache.clear();

const slots=shuffled.map((src,index)=>{
const img=document.createElement("img");
img.src=placeholderImage;
img.dataset.loading="true";
img.dataset.loaded="false";
img.dataset.originalSrc=src;
img.loading="eager";
img.decoding="async";
img.fetchPriority=index<32?"high":"auto";
img.onclick=()=>{};
carousel.appendChild(img);
return {
slot:img,
src,
index,
loaded:false,
loading:false,
failed:false,
candidates:buildImageCandidates(src),
candidateIndex:0,
retryCount:0
};
});

const orderedLoadQueue=[...slots].sort((a,b)=>a.index-b.index);
let queueIndex=0;
let activeLoads=0;
const maxConcurrentLoads=window.innerWidth<=900?56:40;

function finalizeLoadedItem(item,resolvedSrc){
setResolvedImagePath(item.src,resolvedSrc);
item.slot.dataset.loading="false";
item.slot.dataset.loaded="true";
item.slot.onclick=()=>{lightboxImg.src=resolvedSrc;lightbox.classList.add("show");};
item.loaded=true;
item.loading=false;
item.failed=false;
}

function tryCandidateWithProbe(item,candidate){
return new Promise((resolve,reject)=>{
const probe=new Image();
probe.decoding="async";
probe.onload=()=>resolve(candidate);
probe.onerror=()=>reject(new Error("probe failed"));
probe.src=candidate;
});
}

function tryNextCandidateOnElement(item){
if(item.candidateIndex>=item.candidates.length){
item.loading=false;
item.failed=true;
item.retryCount++;
item.slot.dataset.loading="false";
item.slot.dataset.loaded="false";
item.slot.style.removeProperty("display");
if(item.retryCount>=20){
markFailedImagePath(item.src);
}
return;
}

const candidate=item.candidates[item.candidateIndex++];

item.slot.onerror=()=>{
item.slot.dataset.loaded="false";
item.slot.style.removeProperty("display");
tryNextCandidateOnElement(item);
};

item.slot.onload=()=>{
finalizeLoadedItem(item,candidate);
};

item.slot.src=candidate;
}

function attachResolvedImage(item,resolvedSrc){
item.slot.onerror=()=>{
item.loading=false;
item.loaded=false;
item.failed=false;
item.slot.dataset.loaded="false";
item.slot.style.removeProperty("display");
resolvedImageCache.delete(item.src);
pendingResolutionCache.delete(item.src);
item.candidateIndex=0;
loadSlot(item);
};

item.slot.onload=()=>{
finalizeLoadedItem(item,resolvedSrc);
};

item.slot.src=resolvedSrc;
}

function loadSlot(item){
if(item.loaded||item.loading) return Promise.resolve();

item.loading=true;
item.failed=false;
item.slot.dataset.loading="true";
item.slot.dataset.loaded="false";
item.slot.style.removeProperty("display");

const cachedResolved=getResolvedImagePath(item.src);
if(cachedResolved){
attachResolvedImage(item,cachedResolved);
return Promise.resolve();
}

return resolveImagePathAggressive(item.src,item.candidates).then(resolved=>{
item.candidateIndex=item.candidates.indexOf(resolved)+1;
attachResolvedImage(item,resolved);
}).catch(()=>{
const remainingCandidates=item.candidates.slice(item.candidateIndex);

const tryProbeSequence=(index=0)=>{
if(index>=remainingCandidates.length){
item.candidateIndex=item.candidates.length;
tryNextCandidateOnElement(item);
return Promise.resolve();
}

const candidate=remainingCandidates[index];

return tryCandidateWithProbe(item,candidate).then(resolved=>{
item.candidateIndex=item.candidates.indexOf(resolved)+1;
attachResolvedImage(item,resolved);
}).catch(()=>{
return tryProbeSequence(index+1);
});
};

return tryProbeSequence();
});
}

function enqueuePriorityItems(items){
const sortedItems=[...items]
.filter(item=>!item.loaded&&!item.loading)
.sort((a,b)=>a.index-b.index);

sortedItems.forEach(item=>{
const idx=orderedLoadQueue.indexOf(item);
if(idx>-1&&idx>=queueIndex){
[orderedLoadQueue[queueIndex],orderedLoadQueue[idx]]=[orderedLoadQueue[idx],orderedLoadQueue[queueIndex]];
queueIndex++;
}
});
queueIndex=Math.min(queueIndex,orderedLoadQueue.length);
pumpQueue();
}

function pumpQueue(){
while(activeLoads<maxConcurrentLoads&&queueIndex<orderedLoadQueue.length){
const item=orderedLoadQueue[queueIndex++];
if(item.loaded||item.loading) continue;
activeLoads++;
loadSlot(item).finally(()=>{
const release=()=>{
if(item.loaded||item.failed||!item.loading){
activeLoads--;
pumpQueue();
}else{
setTimeout(release,10);
}
};
release();
});
}
}

function loadInitialBatch(){
orderedLoadQueue.slice(0,orderedLoadQueue.length).forEach(item=>{
if(item.loaded||item.loading) return;
});
pumpQueue();
}

function getPriorityItems(){
return slots.filter(item=>{
if(item.loaded) return false;
const rect=item.slot.getBoundingClientRect();
return rect.top<window.innerHeight+10000&&rect.bottom>-10000&&rect.left<window.innerWidth+10000&&rect.right>-10000;
}).sort((a,b)=>a.index-b.index);
}

function retryFailedItems(){
slots.forEach(item=>{
if(item.loaded) return;
if(item.loading) return;
item.failed=false;
item.candidateIndex=0;
item.slot.dataset.loaded="false";
item.slot.style.removeProperty("display");
});
loadVisibleAndNearby();
startFullSurfacePass();
}

function loadVisibleAndNearby(){
enqueuePriorityItems(getPriorityItems());
}

function startFullSurfacePass(){
enqueuePriorityItems(orderedLoadQueue);
pumpQueue();
}

const observer=new IntersectionObserver(entries=>{
const visibleItems=[];
entries.forEach(entry=>{
if(!entry.isIntersecting) return;
const item=slots.find(slotItem=>slotItem.slot===entry.target);
if(item) visibleItems.push(item);
});
if(visibleItems.length){
visibleItems.sort((a,b)=>a.index-b.index);
enqueuePriorityItems(visibleItems);
}
},{
root:null,
rootMargin:"12000px",
threshold:0.01
});

slots.forEach(item=>observer.observe(item.slot));

prewarmImageResolutions(slots);
loadInitialBatch();
loadVisibleAndNearby();
startFullSurfacePass();

scrollLeft=carousel.scrollLeft;
});

});

});

});

scrollLeft=carousel.scrollLeft;
});

});

    });

    setTimeout(keepHeroVideoAlive, 350);
    setTimeout(keepHeroVideoAlive, 800);
  }

  /* ===== IMAGES: stronger fallback resolution ===== */
  if (typeof buildImageCandidates === "function") {
    const originalBuildImageCandidates = buildImageCandidates;

    buildImageCandidates = function(path) {
      const originalCandidates = originalBuildImageCandidates(path);
      const fallbackSet = new Set(originalCandidates);

      const slashIndex = path.lastIndexOf("/");
      const filePart = slashIndex > -1 ? path.slice(slashIndex + 1) : path;
      const cleanFile = filePart.replace(/\*/g, "").replace(/^\.\//, "");

      let exactBaseName = cleanFile.includes(".")
        ? cleanFile.replace(/\.[^.]+$/, "")
        : cleanFile;

      const numberMatch = cleanFile.match(/(\d+)/);
      const numberValue = numberMatch ? parseInt(numberMatch[1], 10) : null;

      const baseNames = new Set([exactBaseName]);
      if (numberValue !== null) {
        baseNames.add(`img${numberValue}`);
        baseNames.add(`IMG${numberValue}`);
        baseNames.add(`Img${numberValue}`);
      }

      const likelyDirs = [
        "BlairPageImages/",
        "./BlairPageImages/",
        "images/",
        "./images/"
      ];

      ["jpg", "jpeg", "png", "webp", "gif", "JPG", "JPEG", "PNG", "WEBP", "GIF"].forEach(ext => {
        baseNames.forEach(base => {
          likelyDirs.forEach(dir => {
            const candidate = `${dir}${base}.${ext}`;
            fallbackSet.add(candidate);
            fallbackSet.add(encodeURI(candidate));
            fallbackSet.add(candidate.replace(/ /g, "%20"));
          });
        });
      });

      return [...fallbackSet];
    };

          'height:calc((100vw - 24px) * .5625)!important;' +
        '}' +
        '#' + BUTTON_ID + '{' +
          'left:12px!important;' +
          'bottom:12px!important;' +
        '}' +
      '}';

    document.head.appendChild(style);
  }

  function createPlayer() {
    removeOld();
    injectStyle();

    var player = document.createElement('div');
    player.id = PLAYER_ID;

    var button = document.createElement('button');
    button.id = BUTTON_ID;
    button.type = 'button';

    var state = 'closed';

    function setButton() {
      if (state === 'closed') button.innerHTML = '▶';
      if (state === 'muted') button.innerHTML = '🔊';
      if (state === 'playing') button.innerHTML = '🔇';
      if (state === 'stopped') button.innerHTML = '✕';
    }

    function loadIframe(muted) {
      player.innerHTML =
        '<iframe ' +
          'src="' + buildSrc(muted) + '" ' +
          'allow="autoplay; encrypted-media; picture-in-picture" ' +
          'allowfullscreen>' +
        '</iframe>';
    }

    function openMuted() {
      state = 'muted';
      player.classList.add('open');
      loadIframe(true);
      setButton();
    }

    function openUnmuted() {
      state = 'playing';
      player.classList.add('open');
      loadIframe(false);
      setButton();
    }

    function stopOpen() {
      state = 'stopped';
      player.innerHTML = '';
      player.classList.add('open');
      setButton();
    }

    function closeAll() {
      state = 'closed';
      player.innerHTML = '';
      player.classList.remove('open');
      setButton();
    }

    button.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();

      if (state === 'closed') {
        openMuted();
        return;
      }

      if (state === 'muted') {
        openUnmuted();
        return;
      }

      if (state === 'playing') {
        stopOpen();
        return;
      }

      if (state === 'stopped') {
        closeAll();
        return;
      }
    });

    document.body.appendChild(player);
    document.body.appendChild(button);

    closeAll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', createPlayer);
  } else {
    createPlayer();
  }
})();
</script>

<script id="gallery1-final-carousel-image-rebuild-fix">
/* ==========================================
   FINAL OVERRIDE — GALLERY1 IMAGE REBUILD FIX
   Uses the same JSON reading/path resolution flow
   as Gallery 2 while leaving Gallery 1 UI intact.
   ========================================== */
(function () {
  if (window.__GALLERY1_FINAL_IMAGE_REBUILD_FIX__) return;
  window.__GALLERY1_FINAL_IMAGE_REBUILD_FIX__ = true;

  const JSON_PATHS = [
    'images.json',
    './images.json',
    'BlairPageImages/images.json',
    './BlairPageImages/images.json'
  ];

  const FALLBACK_IMAGE_LIST = Array.from({ length: 60 }, (_, index) => `BlairPageImages/img${index + 1}`);

  const IMAGE_EXTENSIONS = [
    'jpg','jpeg','png','webp','gif','JPG','JPEG','PNG','WEBP','GIF',
    'Jpg','Jpeg','Png','Webp','Gif'
  ];

  const IMAGE_DIRS = [
    '',
    './',
    'BlairPageImages/',
    './BlairPageImages/',
    'images/',
    './images/'
  ];

  function unique(list) {
    return [...new Set(list.filter(Boolean))];
  }

  function cleanPath(value) {
    return String(value || '')
      .trim()
      .replace(/^["']|["']$/g, '')
      .replace(/\\/g, '/');
  }

  function hasImageExtension(value) {
    return /\.(jpg|jpeg|png|webp|gif|avif|bmp|svg)$/i.test(value);
  }

  function basenameNoExt(value) {
    const clean = cleanPath(value).split('?')[0].split('#')[0];
    const file = clean.split('/').pop() || clean;
    return file.replace(/\.[^.]+$/, '');
  }

  function buildFinalCandidates(rawPath) {
    const src = cleanPath(rawPath);
    if (!src) return [];

    if (/^(https?:)?\/\//i.test(src) || src.startsWith('data:')) {
      return [src];
    }

    const candidates = [];
    const encoded = encodeURI(src);

    candidates.push(src, './' + src.replace(/^\.\//, ''), encoded);

    if (hasImageExtension(src)) {
      const baseFile = src.split('/').pop();
      IMAGE_DIRS.forEach(dir => {
        candidates.push(dir + baseFile);
        candidates.push(encodeURI(dir + baseFile));
      });
    } else {
      IMAGE_EXTENSIONS.forEach(ext => {
        candidates.push(`${src}.${ext}`);
        candidates.push(`./${src.replace(/^\.\//, '')}.${ext}`);
      });
    }

    const base = basenameNoExt(src);
    const numberMatch = base.match(/(\d+)/);
    const baseNames = [base];

    if (numberMatch) {
      const n = parseInt(numberMatch[1], 10);
      baseNames.push(`img${n}`, `Img${n}`, `IMG${n}`, `${n}`);
    }

    baseNames.forEach(name => {
      IMAGE_DIRS.forEach(dir => {
        IMAGE_EXTENSIONS.forEach(ext => {
          candidates.push(`${dir}${name}.${ext}`);
          candidates.push(encodeURI(`${dir}${name}.${ext}`));
        });
      });
    });

    return unique(candidates);
  }

  function testImage(candidate) {
    return new Promise((resolve, reject) => {
      const probe = new Image();
      probe.decoding = 'async';
      probe.loading = 'eager';
      probe.onload = () => resolve(candidate);
      probe.onerror = reject;
      probe.src = candidate;
    });
  }

  async function resolveFirstWorkingImage(rawPath) {
    const candidates = buildFinalCandidates(rawPath);

    for (const candidate of candidates) {
      try {
        return await testImage(candidate);
      } catch (error) {}
    }

    return null;
  }

  async function fetchGalleryList() {
    for (const jsonPath of JSON_PATHS) {
      try {
        const response = await fetch(jsonPath + '?v=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) continue;

        const data = await response.json();

        if (Array.isArray(data) && data.length) {
          return data.map(cleanPath).filter(Boolean);
        }
      } catch (error) {}
    }

    return FALLBACK_IMAGE_LIST;
  }

  function getCarousel() {
    return document.getElementById('galleryCarousel');
  }

  function getLightboxParts() {
    return {
      lightbox: document.getElementById('lightbox'),
      lightboxImg: document.getElementById('lightboxImg')
    };
  }

  function hardShowImage(img, resolvedSrc) {
    img.removeAttribute('data-src');
    img.dataset.loaded = 'true';
    img.dataset.loading = 'false';
    img.style.setProperty('display', 'block', 'important');
    img.style.setProperty('visibility', 'visible', 'important');
    img.style.setProperty('opacity', '1', 'important');
    img.src = resolvedSrc;
  }

  async function rebuildGalleryImages() {
    const carousel = getCarousel();
    if (!carousel) return;

    const list = await fetchGalleryList();
    window.galleryImagesData = list;

    carousel.innerHTML = '';

    const slots = list.map((src, index) => {
      const img = document.createElement('img');
      img.alt = `Gallery image ${index + 1}`;
      img.loading = 'eager';
      img.decoding = 'async';
      img.dataset.originalSrc = src;
      img.dataset.loading = 'true';
      img.dataset.loaded = 'false';
      img.style.setProperty('display', 'none', 'important');
      carousel.appendChild(img);
      return { img, src, index };
    });

    let cursor = 0;
    const concurrency = window.innerWidth <= 900 ? 10 : 8;

    async function worker() {
      while (cursor < slots.length) {
        const item = slots[cursor++];
        const resolved = await resolveFirstWorkingImage(item.src);

        if (!resolved) {
          item.img.dataset.loading = 'false';
          item.img.dataset.loaded = 'false';
          item.img.style.setProperty('display', 'none', 'important');
          continue;
        }

        hardShowImage(item.img, resolved);

        item.img.onclick = () => {
          const parts = getLightboxParts();
          if (parts.lightbox && parts.lightboxImg) {
            parts.lightboxImg.src = resolved;
            parts.lightbox.classList.add('show');
          }
        };
      }
    }

    await Promise.all(Array.from({ length: concurrency }, worker));

    const loadedCount = carousel.querySelectorAll('img[data-loaded="true"]').length;

    if (!loadedCount && list !== FALLBACK_IMAGE_LIST) {
      window.galleryImagesData = FALLBACK_IMAGE_LIST;
      carousel.innerHTML = '';
      setTimeout(rebuildGalleryImages, 100);
    }
  }

  function runFinalPasses() {
    rebuildGalleryImages();
    setTimeout(rebuildGalleryImages, 500);
    setTimeout(rebuildGalleryImages, 1500);
  }

  const originalInitializeGallery = window.initializeGallery;
  window.initializeGallery = function finalInitializeGalleryOverride(images) {
    if (Array.isArray(images) && images.length) {
      window.galleryImagesData = images;
    }
    setTimeout(rebuildGalleryImages, 0);
    return originalInitializeGallery ? undefined : undefined;
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runFinalPasses, { once: true });
  } else {
    runFinalPasses();
  }

  window.addEventListener('load', () => setTimeout(rebuildGalleryImages, 100));
  window.addEventListener('pageshow', () => setTimeout(rebuildGalleryImages, 100));

  const refresh = document.getElementById('refreshPhotosBtn');
  if (refresh) {
    refresh.addEventListener('click', () => {
      setTimeout(rebuildGalleryImages, 0);
      setTimeout(rebuildGalleryImages, 350);
    });
  }
})();
</script>

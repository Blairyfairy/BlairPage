<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blair Page | Gallery</title>
<link rel="stylesheet" href="style.css">
<style>

/* ===== GLOBAL RESET ===== */
html, body{
  margin:0;
  padding:0;
  height:100%;
}

/* Gallery page: keep html/body transparent so this page's own video
   acts as the true background (style.css may paint a background for
   other pages, which would otherwise sit above the z-index:-1 hero). */
html,
body#gallery-page{
  background:transparent !important;
  background-color:transparent !important;
  background-image:none !important;
}

/* ===== THEME VARIABLES (match blog glass style) ===== */

:root{
  --glass-bg: rgba(58,62,59,0.15);
  --glass-border: rgba(240,239,244,0.22);
  --black: #000000ff;
  --midnight-violet: #291528ff;
  --charcoal-brown: #3a3e3bff;
  --ghost-white: #f0eff4ff;
  --dusty-mauve: #9e829cff;
  --text-light: var(--ghost-white);
  --bg-light: linear-gradient(
    135deg,
    #000000ff 0%,
    #291528ff 30%,
    #3a3e3bff 60%,
    #9e829cff 85%,
    #f0eff4ff 100%
  );
}

body.dark{
  --glass-bg: rgba(8,10,14,0.42);
  --glass-border: rgba(240,239,244,0.14);
  --text-light: var(--ghost-white);
  --bg-light: linear-gradient(
    135deg,
    #050507 0%,
    #0d0f16 25%,
    #141824 55%,
    #1c1f2b 78%,
    #26212d 100%
  );
}

/* ===== Perf-friendly rendering hints (no visual change) ===== */
html{
  overflow-x:clip;
  text-size-adjust:100%;
  -webkit-text-size-adjust:100%;
}

body{
  overflow-x:clip;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}

img, video, iframe, canvas, svg{
  max-width:100%;
}

/* ===== Top Bar ===== */

.top-bar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem 2rem;
  font-size:.85rem;
  position:absolute;
  top:0;
  width:100%;
  z-index:100;
  box-sizing:border-box;
}

.site-nav a{
  margin:0 1rem;
  color:#9e829c;
  text-decoration:none;
  font-weight:600;
}

.site-nav a:hover{
  text-decoration:underline;
  color:#f0eff4;
}

.theme-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid var(--glass-border);
  border-radius:20px;
  padding:.4rem 1rem;
  min-width:44px;
  min-height:34px;
  font-size:.85rem;
  font-weight:400;
  line-height:1;
  letter-spacing:0;
  box-sizing:border-box;
  box-shadow:none;
  margin:0;
  color:var(--text-light);
  cursor:pointer;
  backdrop-filter:none;
  -webkit-backdrop-filter:none;
  outline:none;
  touch-action:manipulation;
}

/* ===== Hero Video ===== */

.hero{
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  width:100vw;
  height:100vh;
  height:100dvh;
  overflow:hidden;
  z-index:-1;
  margin:0; padding:0;
  background:none;
  pointer-events:none;
  contain:paint;
}

.hero video{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  min-width:100%;
  min-height:100%;
  object-fit:cover;
  object-position:center;
  filter:brightness(.6);
  display:block;
  background:transparent;
  transform:translateZ(0);
}

body.dark .hero video{
  filter:brightness(.32);
}

/* ===== Logo ===== */

.logo-top-left{
  position:absolute;
  top:100px;
  left:16px;
  z-index:1000;
  width:60px;
  height:60px;
  border-radius:50%;
  overflow:hidden;
  cursor:pointer;
  border:3px solid rgba(240,239,244,.45);
  box-shadow:0 8px 20px rgba(0,0,0,.7);
  transition:transform .3s ease, box-shadow .3s ease;
}

.logo-top-left img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.logo-top-left:hover{
  transform:scale(1.05);
  box-shadow:0 12px 28px rgba(0,0,0,.8);
}

/* ===== Gallery page shell (isolated from shared style.css) ===== */

.gallery-page-shell{
  display:block;
  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  min-height:100vh;
  min-height:100dvh;
  background:transparent;
}

.gallery-wrapper{
  position:relative;
  top:calc(100vh - 230px);
  width:100%;
  max-width:1600px;
  padding:1rem;
  margin:0 auto;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  background:transparent;
  contain:layout paint;
}

/* ===== Refresh Button ===== */

.refresh-photos-btn{
  background:var(--glass-bg);
  border:1px solid var(--glass-border);
  border-radius:999px;
  padding:.7rem 1.15rem;
  cursor:pointer;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  color:var(--text-light);
  font-weight:600;
  letter-spacing:.01em;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
  transition:transform .25s ease, box-shadow .25s ease, border-color .25s ease, background .25s ease;
  margin-bottom:1rem;
  touch-action:manipulation;
}

.refresh-photos-btn:hover{
  transform:translateY(-1px);
  box-shadow:0 14px 28px rgba(0,0,0,.24);
  border-color:rgba(240,239,244,0.32);
  background:rgba(240,239,244,0.10);
}

/* ===== Carousel (desktop: horizontal drag strip) ===== */

.gallery-carousel{
  display:flex;
  gap:12px;
  transition:transform .3s ease;
  cursor:grab;
  overflow-x:auto;
  overflow-y:hidden;
  max-width:100%;
  scrollbar-width:none;
  -ms-overflow-style:none;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior-x:contain;
}

.gallery-carousel::-webkit-scrollbar{
  display:none;
}

.gallery-carousel.dragging{
  cursor:grabbing;
}

.gallery-carousel img{
  width:200px;
  height:200px;
  flex-shrink:0;
  border-radius:14px;
  object-fit:cover;
  background:rgba(240,239,244,0.08);
  border:1px solid rgba(240,239,244,0.18);
  box-shadow:none;
  transition:transform .3s ease, box-shadow .3s ease, border-color .3s ease, background .3s ease, opacity .3s ease;
  opacity:0;
  content-visibility:auto;
  contain-intrinsic-size:200px 200px;
}

.gallery-carousel img[data-loaded="true"]{
  opacity:1;
}

.gallery-carousel img:hover{
  transform:scale(1.05);
  border-color:rgba(240,239,244,0.28);
  background:rgba(240,239,244,0.12);
}

/* ===== Arrows (desktop) ===== */

.arrow{
  position:absolute;
  top:calc(50% + 22px);
  transform:translateY(-50%);
  background:#9e829c;
  border:none;
  padding:.5rem 1rem;
  cursor:pointer;
  border-radius:50%;
  z-index:1000;
  touch-action:manipulation;
}

.arrow-left{ left:10px; }
.arrow-right{ right:10px; }

.arrow:hover{
  background:#9e829c;
}

/* ===== Lightbox ===== */

.lightbox{
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background:rgba(0,0,0,.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

.lightbox img{
  max-width:90%;
  max-height:90%;
  border-radius:14px;
}

.lightbox.show{
  display:flex;
}

/* ===== Page scroll-to-top ===== */

.page-scroll-top{
  position:fixed;
  right:18px;
  bottom:18px;
  width:28px;
  height:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0;
  margin:0;
  background:transparent;
  border:none;
  outline:none;
  box-shadow:none;
  color:#ffffff;
  font-size:18px;
  line-height:1;
  cursor:pointer;
  z-index:10050;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  appearance:none;
  -webkit-appearance:none;
  touch-action:manipulation;
}

.page-scroll-top.show{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

.page-scroll-top span{
  display:block;
  line-height:1;
  transform:translateY(-1px);
}

@media(prefers-reduced-motion:reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

/* ===== Mobile ===== */

@media(max-width:900px){

  html, body{
    min-height:100vh;
    min-height:100dvh;
    height:auto !important;
    background:var(--bg-light) !important;
    background-image:var(--bg-light) !important;
    background-repeat:no-repeat !important;
    background-size:cover !important;
    background-attachment:scroll !important;
    overflow-x:hidden !important;
    overflow-y:auto !important;
    -webkit-overflow-scrolling:touch;
  }

  /* prevents a white flash/rectangle at the top/bottom rubber-band edges */
  body::before{
    content:"";
    position:fixed;
    inset:-2px 0 -2px 0;
    background:var(--bg-light) !important;
    z-index:-3;
    pointer-events:none;
  }

  .top-bar{
    display:grid !important;
    grid-template-columns:minmax(0,1fr) auto !important;
    grid-template-areas:
      "cred toggle"
      "nav  toggle" !important;
    align-items:start !important;
    row-gap:2px !important;
    column-gap:10px !important;
    position:absolute !important;
    top:0 !important;
    left:0 !important;
    width:100% !important;
    min-height:52px !important;
    padding:10px 16px 0 16px !important;
    box-sizing:border-box !important;
  }

  .credential-header{
    grid-area:cred !important;
    display:block !important;
    position:relative !important;
    top:auto !important; left:auto !important; right:auto !important;
    transform:none !important;
    margin:0 !important;
    padding:0 !important;
    width:auto !important;
    max-width:calc(100% - 64px) !important;
    font-size:0.425rem !important;
    line-height:1.05 !important;
    text-align:left !important;
    justify-self:start !important;
    align-self:start !important;
  }

  .credential-header,
  .credential-header *{
    text-align:left !important;
  }

  .site-nav{
    grid-area:nav !important;
    display:flex !important;
    position:relative !important;
    top:auto !important; left:auto !important; right:auto !important;
    transform:none !important;
    justify-content:flex-start !important;
    justify-self:start !important;
    align-items:center !important;
    align-content:flex-start !important;
    flex-wrap:wrap !important;
    width:auto !important;
    min-width:0 !important;
    margin:2px 0 0 0 !important;
    padding:0 !important;
    gap:0 !important;
    overflow:visible !important;
  }

  .site-nav a{
    display:inline-block !important;
    white-space:nowrap !important;
    margin:0 0.7rem 0 0 !important;
    font-size:0.78rem !important;
    line-height:1.2 !important;
    text-align:left !important;
  }

  .theme-btn,
  #themeToggle{
    grid-area:toggle !important;
    position:relative !important;
    top:auto !important; right:auto !important;
    justify-self:end !important;
    align-self:start !important;
    min-width:44px !important;
    min-height:34px !important;
    z-index:1005 !important;
    pointer-events:auto !important;
    margin:0 !important;
  }

  .hero{
    height:100vh;
    height:100dvh;
    min-height:100dvh;
  }

  .hero video{
    object-position:center center;
  }

  .logo-top-left{
    top:80px;
    width:50px;
    height:50px;
  }

  .arrow{
    display:none;
  }

  .refresh-photos-btn{
    width:100%;
    max-width:280px;
    padding:.78rem 1rem;
    margin-bottom:1rem;
  }

  .page-scroll-top{
    right:14px;
    bottom:14px;
    width:26px;
    height:26px;
    font-size:17px;
    z-index:10060;
  }

  /* the whole photo area scrolls with the page, vertically, so the
     full-screen video keeps showing through underneath as you go */
  .gallery-wrapper{
    top:calc(100dvh - 190px);
    padding-bottom:24px;
  }

  .gallery-carousel{
    flex-wrap:wrap;
    justify-content:center;
    overflow:visible;
    max-width:none;
    cursor:default;
    touch-action:pan-y;
  }

  .gallery-carousel img{
    width:45%;
    height:auto;
    aspect-ratio:1 / 1;
    margin-bottom:10px;
    touch-action:pan-y;
  }
}

@media(max-width:900px) and (orientation:landscape){
  .gallery-wrapper{
    top:calc(100dvh - 90px);
  }
}

@media(max-width:640px){
  .site-nav a{
    margin:0 0.55rem 0 0 !important;
    font-size:0.74rem !important;
    line-height:1.15 !important;
  }
}

@media(max-width:420px){
  .credential-header{
    max-width:calc(100% - 58px) !important;
  }
  .site-nav a{
    margin:0 0.45rem 0 0 !important;
    font-size:0.7rem !important;
    line-height:1.1 !important;
  }
}

</style>
</head>

<body id="gallery-page">

<header class="top-bar">
  <div class="credential-header">
    RHCE6 · AWS Certified
  </div>

  <nav class="site-nav">
    <a href="index.html">Home</a>
    <a href="gallery.html">Gallery</a>
    <a href="blog.html">Blog</a>
    <a href="enterprise_clients_infographic.html">Enterprise Info</a>
    <a href="cloud_providers_infographic.html">Cloud Info</a>
    <a href="live_cloud_provider_signal_board.html">Live Info</a>
  </nav>

  <button id="themeToggle" class="theme-btn">🌙</button>
</header>

<a href="index.html" class="logo-top-left">
  <img src="BlairPageImages/yacht.jpg" alt="Blair Page Logo">
</a>

<div class="hero">
  <video id="heroVideo" autoplay muted loop playsinline webkit-playsinline preload="auto">
    <source src="BlairPageImages/Yacht.mp4" type="video/mp4">
  </video>
</div>

<main class="gallery-page-shell">
  <div class="gallery-wrapper">

    <button id="refreshPhotosBtn" class="refresh-photos-btn" type="button">Refresh Photos</button>

    <button class="arrow arrow-left" aria-label="Scroll photos left">&#9664;</button>

    <div id="galleryCarousel" class="gallery-carousel"></div>

    <button class="arrow arrow-right" aria-label="Scroll photos right">&#9654;</button>

  </div>
</main>

<div id="lightbox" class="lightbox">
  <img id="lightboxImg" alt="">
</div>

<button id="pageScrollTop" class="page-scroll-top" aria-label="Back to top"><span>▲</span></button>

<div class="footer-counter" style="margin-top:12px;text-align:center;">
    <img
        src="https://hits.sh/blairyfairy.github.io/BlairPage.svg?style=flat-square&label=Portfolio%20Visitors"
        alt="Portfolio Visitors"
        style="border-radius:8px;opacity:.9;">
</div>

<script>
(function(){
"use strict";

/* =========================================================
   HERO VIDEO
   Lightweight autoplay/keepalive — no polling loop, no
   element rebuilding, just correct attributes + a couple of
   safe retries around the points mobile browsers commonly
   block autoplay (metadata ready, tab refocus, first touch).
   ========================================================= */
const heroVideo = document.getElementById("heroVideo");

function hardenVideo(v){
  v.muted = true;
  v.defaultMuted = true;
  v.loop = true;
  v.playsInline = true;
  v.playbackRate = 1;
  v.defaultPlaybackRate = 1;
  v.setAttribute("muted","");
  v.setAttribute("loop","");
  v.setAttribute("playsinline","");
  v.setAttribute("webkit-playsinline","");
}

function tryPlay(){
  if(!heroVideo) return;
  hardenVideo(heroVideo);
  const p = heroVideo.play();
  if(p && typeof p.catch === "function"){
    p.catch(()=>{ bindGestureUnlock(); });
  }
}

let gestureBound = false;
function bindGestureUnlock(){
  if(gestureBound) return;
  gestureBound = true;
  const unlock = () => {
    tryPlay();
    window.removeEventListener("touchend", unlock);
    window.removeEventListener("click", unlock);
    gestureBound = false;
  };
  window.addEventListener("touchend", unlock, { passive:true, once:true });
  window.addEventListener("click", unlock, { passive:true, once:true });
}

if(heroVideo){
  hardenVideo(heroVideo);

  ["loadedmetadata","loadeddata","canplay"].forEach(evt=>{
    heroVideo.addEventListener(evt, tryPlay, { passive:true, once:true });
  });

  heroVideo.addEventListener("ended", () => {
    heroVideo.currentTime = 0;
    tryPlay();
  });

  heroVideo.addEventListener("pause", () => {
    // only auto-resume if it wasn't paused by a deliberate desktop click
    if(window.innerWidth <= 900) tryPlay();
  });

  document.addEventListener("visibilitychange", () => {
    if(!document.hidden) tryPlay();
  }, { passive:true });

  window.addEventListener("pageshow", tryPlay, { passive:true });

  // desktop only: click the video to pause/resume
  if(window.innerWidth > 900){
    heroVideo.addEventListener("click", () => {
      heroVideo.paused ? tryPlay() : heroVideo.pause();
    });
  }

  tryPlay();
}

/* =========================================================
   THEME TOGGLE
   ========================================================= */
const themeToggle = document.getElementById("themeToggle");
themeToggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
themeToggle.addEventListener("click", () => {
  document.body.classList.toggle("dark");
  themeToggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
});

/* =========================================================
   GALLERY IMAGES
   One loader. Trust images.json paths first (that's the
   normal, fast path — a single request, no probing needed).
   Only if a path 404s do we try a short list of likely
   alternate extensions/folders, instead of testing hundreds
   of Image() combinations up front like before.
   ========================================================= */
const carousel = document.getElementById("galleryCarousel");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightboxImg");
const refreshPhotosBtn = document.getElementById("refreshPhotosBtn");

const FALLBACK_EXTENSIONS = ["jpg","jpeg","png","webp","gif","JPG","JPEG","PNG","WEBP"];
const FALLBACK_DIRS = ["BlairPageImages/", ""];

let galleryImagesData = [];

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function basenameNoExt(path){
  const file = path.split("/").pop() || path;
  return file.includes(".") ? file.replace(/\.[^.]+$/, "") : file;
}

// Builds a short, sane list of fallback URLs to try only after the
// original path from images.json has already failed to load.
function buildFallbackCandidates(originalPath){
  const base = basenameNoExt(originalPath);
  const seen = new Set();
  const candidates = [];
  FALLBACK_DIRS.forEach(dir => {
    FALLBACK_EXTENSIONS.forEach(ext => {
      const candidate = `${dir}${base}.${ext}`;
      if(!seen.has(candidate)){
        seen.add(candidate);
        candidates.push(candidate);
      }
    });
  });
  return candidates;
}

function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add("show");
}

function attachTile(img, workingSrc){
  img.dataset.loading = "false";
  img.dataset.loaded = "true";
  img.onclick = () => openLightbox(workingSrc);
}

function tryFallbacks(img, candidates, index){
  if(index >= candidates.length){
    // nothing worked — leave the tile hidden rather than showing a broken image
    img.dataset.loading = "false";
    img.dataset.loaded = "false";
    img.style.display = "none";
    return;
  }
  img.onerror = () => tryFallbacks(img, candidates, index + 1);
  img.onload = () => attachTile(img, candidates[index]);
  img.src = candidates[index];
}

function buildGallery(images){
  carousel.innerHTML = "";
  const shuffled = shuffle(images);

  shuffled.forEach((src, i) => {
    const img = document.createElement("img");
    img.alt = `Gallery photo ${i + 1}`;
    img.loading = i < 12 ? "eager" : "lazy";
    img.decoding = "async";
    img.dataset.loading = "true";
    img.dataset.loaded = "false";

    img.onload = () => attachTile(img, src);
    img.onerror = () => tryFallbacks(img, buildFallbackCandidates(src), 0);
    img.src = src;

    carousel.appendChild(img);
  });
}

function loadGalleryList(){
  return fetch("images.json", { cache: "no-store" })
    .then(res => res.ok ? res.json() : Promise.reject())
    .then(list => (Array.isArray(list) && list.length ? list : Promise.reject()))
    .catch(() => Array.from({ length: 60 }, (_, i) => `BlairPageImages/img${i + 1}.jpg`));
}

loadGalleryList().then(images => {
  galleryImagesData = images;
  buildGallery(galleryImagesData);
});

refreshPhotosBtn.addEventListener("click", () => {
  if(galleryImagesData.length) buildGallery(galleryImagesData);
});

/* =========================================================
   LIGHTBOX close
   ========================================================= */
lightbox.addEventListener("click", () => lightbox.classList.remove("show"));

/* =========================================================
   CAROUSEL DRAG SCROLL — desktop / mouse only.
   On mobile the carousel wraps into a grid (see CSS) and the
   page itself scrolls vertically, so no drag handling is
   attached there — that's what makes photo browsing on
   mobile a normal up/down scroll instead of fighting a
   horizontal-only strip.
   ========================================================= */
const isDesktop = () => window.innerWidth > 900;
let isDown = false, startX = 0, startScrollLeft = 0;

carousel.addEventListener("mousedown", e => {
  if(!isDesktop()) return;
  isDown = true;
  carousel.classList.add("dragging");
  startX = e.pageX - carousel.offsetLeft;
  startScrollLeft = carousel.scrollLeft;
});

["mouseleave", "mouseup"].forEach(evt => {
  carousel.addEventListener(evt, () => {
    isDown = false;
    carousel.classList.remove("dragging");
  });
});

carousel.addEventListener("mousemove", e => {
  if(!isDown) return;
  e.preventDefault();
  const x = e.pageX - carousel.offsetLeft;
  carousel.scrollLeft = startScrollLeft - (x - startX) * 2;
});

const arrowLeft = document.querySelector(".arrow-left");
const arrowRight = document.querySelector(".arrow-right");
arrowLeft.addEventListener("click", () => carousel.scrollBy({ left: -220, behavior: "smooth" }));
arrowRight.addEventListener("click", () => carousel.scrollBy({ left: 220, behavior: "smooth" }));

/* =========================================================
   PAGE SCROLL-TO-TOP
   ========================================================= */
const pageScrollTop = document.getElementById("pageScrollTop");

function updatePageScrollButton(){
  const y = window.scrollY || document.documentElement.scrollTop || 0;
  pageScrollTop.classList.toggle("show", y > 150);
}

pageScrollTop.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
window.addEventListener("scroll", updatePageScrollButton, { passive: true });
window.addEventListener("resize", updatePageScrollButton, { passive: true });
updatePageScrollButton();

})();
</script>

<!-- ==========================================
     FIXED LEFT FLOATING PLAYER
     SAME VIDEO ID: 4AYJZvHeKFo — starts closed
     ========================================== -->
<script>
(function () {
  var VIDEO_ID = '4AYJZvHeKFo';
  var PLAYER_ID = 'left-floating-player-2';
  var BUTTON_ID = 'left-floating-button-2';
  var STYLE_ID = 'left-floating-player-style-2';

  function buildSrc(muted) {
    return 'https://www.youtube.com/embed/' + VIDEO_ID +
      '?autoplay=1' +
      '&mute=' + (muted ? '1' : '0') +
      '&controls=1' +
      '&loop=1' +
      '&playlist=' + VIDEO_ID +
      '&playsinline=1' +
      '&rel=0' +
      '&modestbranding=1';
  }

  function injectStyle() {
    var style = document.createElement('style');
    style.id = STYLE_ID;
    style.textContent =
      '#' + PLAYER_ID + '{position:fixed;left:20px;bottom:78px;width:260px;height:150px;z-index:10000;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 10px 25px rgba(0,0,0,.6);display:none;}' +
      '#' + PLAYER_ID + '.open{display:block;}' +
      '#' + PLAYER_ID + ' iframe{width:100%;height:100%;border:0;display:block;background:#000;}' +
      '#' + BUTTON_ID + '{position:fixed;left:20px;bottom:20px;width:52px;height:52px;z-index:10001;border-radius:50%;border:1px solid rgba(240,239,244,.35);background:rgba(58,62,59,.72);color:#fff;cursor:pointer;font-size:1.15rem;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);touch-action:manipulation;}' +
      '#' + BUTTON_ID + ':hover{background:rgba(158,130,156,.34);transform:translateY(-2px);}' +
      '@media(max-width:640px){#' + PLAYER_ID + '{left:12px;bottom:72px;width:calc(100vw - 24px);height:calc((100vw - 24px) * .5625);}#' + BUTTON_ID + '{left:12px;bottom:12px;}}';
    document.head.appendChild(style);
  }

  function createPlayer() {
    injectStyle();

    var player = document.createElement('div');
    player.id = PLAYER_ID;

    var button = document.createElement('button');
    button.id = BUTTON_ID;
    button.type = 'button';

    var state = 'closed';

    function setButton() {
      button.textContent = state === 'closed' ? '▶' : state === 'muted' ? '🔊' : state === 'playing' ? '🔇' : '✕';
    }

    function loadIframe(muted) {
      player.innerHTML = '<iframe src="' + buildSrc(muted) + '" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    }

    function openMuted() { state = 'muted'; player.classList.add('open'); loadIframe(true); setButton(); }
    function openUnmuted() { state = 'playing'; player.classList.add('open'); loadIframe(false); setButton(); }
    function stopOpen() { state = 'stopped'; player.innerHTML = ''; player.classList.add('open'); setButton(); }
    function closeAll() { state = 'closed'; player.innerHTML = ''; player.classList.remove('open'); setButton(); }

    button.addEventListener('click', function (e) {
      e.preventDefault();
      e.stopPropagation();
      if (state === 'closed') return openMuted();
      if (state === 'muted') return openUnmuted();
      if (state === 'playing') return stopOpen();
      if (state === 'stopped') return closeAll();
    });

    document.body.appendChild(player);
    document.body.appendChild(button);
    closeAll();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', createPlayer);
  } else {
    createPlayer();
  }
})();
</script>

</body>
